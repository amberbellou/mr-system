function go(p){ S.phase = p; render(); }

/* ---- round flow ---- */
const playable = id => S.roster[id].st !== "out" && !!dilemmaFor(id);
function nextQuestion(){
  const act = ACT();
  while (S.qi < act.length && !playable(act[S.qi].id)) S.qi++;
  if (S.qi >= act.length){ stepCrowd(); go("results"); return; }
  go("dilemma");
}
function advance(){ S.qi++; nextQuestion(); }

function choose(i){
  const ch = ACT()[S.qi], d = dilemmaFor(ch.id), c = d.choices[i];
  if (c.danger && SETTINGS.dangerMode !== "off" && Math.random() < (c.danger.p || 0)){
    const v = (SETTINGS.dangerMode === "unsparing" && c.danger.unsparing)
      ? c.danger.unsparing : c.danger.standard;
    if (v && v.say){
      const r = S.roster[ch.id];
      r.st = v.st;
      r.hist.push({round:S.round, k:c.k, st:v.st, say:v.say, danger:true});
      if (v.st === "out" && r.outRound === null){
        r.outRound = S.round;
        r.why = "Round " + S.round + " \u2014 Mr. System struck: " + c.t;
      }
      S.dangerLog.push({id:ch.id, round:S.round, fatal:!!v.fatal});
      S.pending = {id:ch.id, k:c.k, title:c.t, say:v.say, st:v.st, danger:true, fatal:!!v.fatal};
      go("outcome");
      return;
    }
  }
  if (c.auto){ resolve(ch, c, c.auto, null); return; }
  const def = CHALLENGES[c.chal];
  S.chal = {def: def, left: def.secs, endAt: Date.now() + def.secs * 1000,
            answers: {}, step: 0, choice: c, ch: ch};
  go("challenge");
}
function resolve(ch, choice, out, chalNote){
  const r = S.roster[ch.id];
  r.st = out.st;
  r.hist.push({round:S.round, k:choice.k, st:out.st, say:out.say});
  if (out.st === "out" && r.outRound === null){
    r.outRound = S.round;
    r.why = "Round " + S.round + " \u2014 chose: " + choice.t;
  }
  S.pending = {id:ch.id, k:choice.k, title:choice.t, say:out.say, st:out.st, chalNote:chalNote};
  go("outcome");
}
function finishChallenge(passed){
  clearTick();
  const t = S.chal, c = t.choice, def = t.def;
  const out = passed ? c.pass : c.fail;
  const note = def.kind === "list"
    ? (passed ? `You named enough of them in time.` : `You ran out of time before you had ${def.need}.`)
    : def.kind === "rapid"
      ? (passed ? `You handled ${t.step} of ${def.qs.length} before the clock ran out.`
                : `You got through ${t.step} of ${def.qs.length}. The rest happened without you.`)
      : (passed ? `Challenge passed.` : `Challenge failed \u2014 and notice what that does and doesn't cost you.`);
  S.chal = null;
  resolve(t.ch, c, out, note);
}
function scoreChallenge(){
  const t = S.chal, def = t.def;
  const cap = def.kind === "list" ? def.need : Math.max(1, Math.min(def.need, (def.qs || []).length));
  if (def.kind === "quiz"){
    let ok = 0;
    def.qs.forEach((q,i) => { if (t.answers[i] === q.a) ok++; });
    return ok >= cap;
  }
  if (def.kind === "list"){
    const el = document.getElementById("listIn");
    const raw = (el ? el.value : "").toLowerCase();
    const toks = raw.split(/[,\n;]+/).map(s => s.trim()).filter(s => s.length >= 3);
    const hits = def.keys.filter(k => raw.indexOf(k) >= 0).length;
    return Math.max(toks.length, hits) >= def.need;
  }
  return t.step >= cap;
}
function startTimer(){
  const t = S.chal; if (!t) return;
  const clock = document.getElementById("clock"), tbar = document.getElementById("tbar");
  const paint = () => {
    if (!clock) return;
    t.left = Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000));
    const frac = t.left / t.def.secs;
    const cls = frac > .5 ? "" : frac > .25 ? "warn" : "crit";
    clock.className = "clock " + cls; clock.textContent = t.left;
    if (tbar){ tbar.className = "tbar " + cls; tbar.firstElementChild.style.width = (frac*100) + "%"; }
  };
  paint();
  tick = setInterval(() => {
    paint();
    if (t.left <= 0){ clearTick(); finishChallenge(scoreChallenge()); }
  }, 250);
}

/* ---- Mr. System's recommendations ---- */
function fmtCharge(name, text){
  let t = text.replace(/^\{NAME\}\s+/, "");
  if (t !== text) t = t.charAt(0).toUpperCase() + t.slice(1);
  return t.replace(/\{NAME\}/g, name);
}
function memoPick(list, filterFn){
  const pool = list.filter(x => !S.chargeUsed.has(x.text || x.charge) && (!filterFn || filterFn(x)));
  return pool.length ? pool[rnd(pool.length)] : null;
}
function buildMemo(){
  if (!SETTINGS.chargesEnabled){ S.memo = null; return; }
  S.voteN++;
  const aliveA = ALIVE();
  if (!aliveA.length){ S.memo = null; return; }
  const items = [];
  const struggling = aliveA.filter(c => S.roster[c.id].st === "strug"
    || S.roster[c.id].hist.some(h => h.st !== "in"));
  /* 1. one grounded charge \u2014 only ever against the already-struggling */
  if (struggling.length){
    const bespoke = memoPick(CHARGES.patterns,
      x => x.forId && struggling.some(c => c.id === x.forId));
    const generic = bespoke ? null : memoPick(CHARGES.patterns, x => !x.forId);
    const pick = bespoke || generic;
    if (pick){
      const who = bespoke ? BY_ID[pick.forId] : struggling[rnd(struggling.length)];
      items.push({kind:"pattern", id:who.id, name:who.name,
        text:fmtCharge(who.name, pick.text), policy:pick.policy});
      S.chargeUsed.add(pick.text);
    }
  }
  /* 2. one or two absurd charges; pointed ones aim at working-class and marginalized kids */
  const nAbsurd = 1 + rnd(2);
  for (let i = 0; i < nAbsurd; i++){
    const pick = memoPick(CHARGES.absurd, null);
    if (!pick) break;
    const pool = pick.aim === "pointed"
      ? (aliveA.filter(c => c.tier !== "upper").length ? aliveA.filter(c => c.tier !== "upper") : aliveA)
      : aliveA;
    const who = pool[rnd(pool.length)];
    items.push({kind:"absurd", id:who.id, name:who.name, text:pick.text, policy:pick.policy});
    S.chargeUsed.add(pick.text);
  }
  /* 3. the withdrawn charge \u2014 upper tier only, guaranteed by vote 2 */
  const cadence = Math.max(1, SETTINGS.withdrawnEvery || 3);
  const withdrawnYet = S.memoLog.some(m => m.withdrawn);
  const fire = (S.voteN % cadence === 0) || (S.voteN === 2 && !withdrawnYet) || (rnd(cadence) === 0);
  const uppers = aliveA.filter(c => c.tier === "upper");
  if (fire && uppers.length){
    const bespoke = memoPick(CHARGES.withdrawn,
      x => x.forId && uppers.some(c => c.id === x.forId));
    const generic = bespoke ? null : memoPick(CHARGES.withdrawn, x => !x.forId);
    const pick = bespoke || generic;
    if (pick){
      const who = bespoke ? BY_ID[pick.forId] : uppers[rnd(uppers.length)];
      items.push({kind:"withdrawn", id:who.id, name:who.name,
        text:fmtCharge(who.name, pick.charge), excuse:pick.excuse});
      S.chargeUsed.add(pick.charge);
    }
  }
  S.memo = items.length ? {items:items} : null;
  S.memoLog.push({round:S.round,
    flagged: items.filter(x => x.kind !== "withdrawn").map(x => x.id),
    withdrawn: items.some(x => x.kind === "withdrawn")});
}

/* ---- voting ---- */
function runVote(){
  const alive = ALIVE();
  if (!S.voteSel || !alive.some(c => c.id === S.voteSel)){ S.voteSel = null; render(); return; }
  const weight = ch => {
    const r = S.roster[ch.id];
    let w = 1;
    if (r.st === "strug") w += 2.6;
    if (ch.tier === "pov") w += 2.2;
    if (ch.tier === "work") w += 0.9;
    if (ch.tier === "upper") w -= 0.55;
    return Math.max(0.15, w);
  };
  const tally = alive.map(ch => ({id:ch.id, n:0}));
  const idx = Object.fromEntries(tally.map((t,i) => [t.id, i]));
  tally[idx[S.voteSel]].n = 1;                       // the player's family
  const others = alive.length - 1;                   // every other surviving family votes
  const pool = alive.map(ch => ({id:ch.id, w:weight(ch)}));
  const total = pool.reduce((a,b) => a + b.w, 0);
  for (let v = 0; v < others; v++){
    let r = Math.random() * total, pick = pool[0].id;
    for (const p of pool){ r -= p.w; if (r <= 0){ pick = p.id; break; } }
    tally[idx[pick]].n++;
  }
  tally.sort((a,b) => b.n - a.n || weight(BY_ID[b.id]) - weight(BY_ID[a.id]));
  S.tally = tally;
  S.eliminated = tally[0].id;
  const r = S.roster[S.eliminated];
  r.st = "out"; r.outRound = S.round; r.why = "Voted out in Round " + S.round;
  r.hist.push({round:S.round, k:"\u2014", st:"out", say:"Voted out by the surviving families."});
  const lastMemo = S.memoLog[S.memoLog.length - 1];
  if (lastMemo) lastMemo.hit = lastMemo.flagged.indexOf(S.eliminated) >= 0;
  go("voteres");
}
function afterVote(){
  S.voteSel = null;
  if (ALIVE().length === 0){ S.round = 4; go("empty"); return; }
  if (S.round < 3){ S.round++; S.qi = 0; go("intro"); }
  else { S.round = 4; go("homework"); }
}

/* ---- final round ---- */
let sketchAbort = null;
function initSketch(){
  const cv = document.getElementById("sketch"); if (!cv) return;
  if (sketchAbort) sketchAbort.abort();
  sketchAbort = new AbortController();
  const sig = sketchAbort.signal;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.round(rect.width); cv.height = Math.round(rect.height);
  const g = cv.getContext("2d");
  g.fillStyle = cssVar("--panel"); g.fillRect(0,0,cv.width,cv.height);
  g.strokeStyle = cssVar("--ink"); g.lineWidth = 4; g.lineCap = "round"; g.lineJoin = "round";
  let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e; return [p.clientX - r.left, p.clientY - r.top]; };
  const down = e => { drawing = true; S.drew = true; const [x,y] = pos(e); g.beginPath(); g.moveTo(x,y); e.preventDefault(); };
  const move = e => { if (!drawing) return; const [x,y] = pos(e); g.lineTo(x,y); g.stroke(); e.preventDefault(); };
  const up = () => { drawing = false; };
  cv.addEventListener("mousedown", down, {signal: sig});
  cv.addEventListener("mousemove", move, {signal: sig});
  window.addEventListener("mouseup", up, {signal: sig});
  cv.addEventListener("touchstart", down, {passive:false, signal: sig});
  cv.addEventListener("touchmove", move, {passive:false, signal: sig});
  window.addEventListener("touchend", up, {passive:true, signal: sig});
}
function startMusic(){
  clearTick();
  const alive = ALIVE();
  S.musicT = 12;
  const clock = document.getElementById("clock");
  const step = () => {
    if (clock) clock.textContent = S.musicT;
    alive.forEach((ch,i) => {
      const el = document.getElementById("run-" + ch.id); if (!el) return;
      const speed = (S.active.indexOf(ch.id) >= 0 && PRIV[ch.id]) ? 4 : 9 + (ch.load || 3);
      const base = 6 + i * (80 / Math.max(1, alive.length));
      el.style.left = Math.max(3, Math.min(90, base + (RM ? 0 : (Math.random()*2-1) * speed))) + "%";
    });
    S.musicT--;
    if (S.musicT < 0){
      clearTick();
      if (ALIVE().length <= 1){ go("debrief"); return; }
      pickTardy();
      if (!S.tardy){ go("debrief"); return; }
      go("tardy");
    }
  };
  step();
  tick = setInterval(step, RM ? 400 : 700);
}
function pickTardy(){
  const alive = ALIVE().filter(c => !(S.active.indexOf(c.id) >= 0 && PRIV[c.id]));
  const pool = alive.length ? alive : ALIVE();
  if (!pool.length){ S.tardy = null; return; }
  const last = pool.slice().sort((a,b) =>
    (b.load + (S.roster[b.id].st === "strug" ? 1.5 : 0)) - (a.load + (S.roster[a.id].st === "strug" ? 1.5 : 0)))[0];
  S.tardy = last.id;
  const r = S.roster[last.id];
  r.st = "out"; r.outRound = 4; r.why = "Final round \u2014 tardy";
  r.hist.push({round:4, k:"\u2014", st:"out", say:"Last one in when the music stopped."});
}

function seedMid(round){
  resetGame(S.classSize);
  S.active = CAST.map(c => c.id);       /* review states use the full deck */
  const n = Math.max(0, S.classSize - S.active.length);
  const mix = ["upper","upper","upper","work","work","work","pov","pov","pov","pov"];
  S.crowd = Array.from({length:n}, (_,i) => ({tier:mix[i % mix.length], st:"in"}));
  S.round = round || 2;
  ["lucia","jayson"].forEach(id => { const r = S.roster[id]; r.st = "out"; r.outRound = 1;
    r.why = "Round 1 \u2014 every option led out";
    const dd = DILEMMAS[1][id];
    const c = dd && (dd.choices.find(x => x.auto && x.auto.st === "out") || dd.choices[0]);
    const say = (c && (c.auto ? c.auto.say : (c.fail && c.fail.say))) || "Out before the first bell.";
    r.hist.push({round:1, k: c ? c.k : "\u2014", st:"out", say:say}); });
  const pick = (id, want) => {
    const cs = (DILEMMAS[1][id] || {choices:[]}).choices;
    for (const c of cs) if (c.auto && c.auto.st === want) return {k:c.k, say:c.auto.say};
    for (const c of cs) if (c.pass && c.pass.st === want) return {k:c.k, say:c.pass.say};
    for (const c of cs) if (c.fail && c.fail.st === want) return {k:c.k, say:c.fail.say};
    return {k:"A", say:"Made it in, at a cost nobody recorded."};
  };
  ["marcus","isabella","carlos","sophia","amina","fatima","ling","aisha","kavi","tyler","marie"].forEach(id => { S.roster[id].st = "strug";
    const o = pick(id,"strug"); S.roster[id].hist.push({round:1,k:o.k,st:"strug",say:o.say}); });
  ["david","alejandra","priya","chase","mei","rajesh","jamal","rebecca","daniel","ayesha","grace"].forEach(id => {
    const o = pick(id,"in"); S.roster[id].hist.push({round:1,k:o.k,st:"in",say:o.say}); });
  stepCrowd();
}
function jumpTo(p, id){
  if (p === "title" || p === "setup" || p === "cast"){ resetGame(S.classSize); return go(p); }
  if (p === "intro"){ seedMid(2); return go("intro"); }
  if (p === "dilemma"){ seedMid(1); S.round = 1; S.qi = ORDER.indexOf(id||"david");
    S.roster[id||"david"].st = "in"; return go("dilemma"); }
  if (p === "challenge"){ seedMid(1); S.round = 1;
    let hit = null;
    for (const cid of ORDER){ const dd = DILEMMAS[1][cid]; if (!dd) continue;
      const c = dd.choices.find(x => x.chal && CHALLENGES[x.chal]);
      if (c){ hit = {id:cid, c:c}; break; } }
    if (!hit){ S.qi = 0; return go("dilemma"); }
    S.qi = ORDER.indexOf(hit.id); S.roster[hit.id].st = "in";
    const def = CHALLENGES[hit.c.chal];
    S.chal = {def:def, left:def.secs, endAt: Date.now() + def.secs * 1000,
              answers:{}, step:0, choice:hit.c, ch:BY_ID[hit.id]};
    return go("challenge"); }
  if (p === "outcome"){ seedMid(1); S.round = 1;
    const dd = DILEMMAS[1].lucia;
    const c = (dd && (dd.choices.find(x => x.auto && x.auto.st === "out") || dd.choices[0])) || null;
    if (!c){ S.qi = 0; return go("dilemma"); }
    S.pending = {id:"lucia", k:c.k, title:c.t, say:(c.auto ? c.auto.say : (c.fail ? c.fail.say : "")), st:"out",
      chalNote:"There was no challenge. There was nothing to win."};
    return go("outcome"); }
  if (p === "results"){ seedMid(1); S.round = 1; return go("results"); }
  if (p === "vote"){ seedMid(1); S.round = 1; S.voteSel = "marcus"; buildMemo(); return go("vote"); }
  if (p === "voteres"){ seedMid(1); S.round = 1; S.voteSel = "marcus"; return runVote(); }
  if (p === "homework" || p === "music" || p === "tardy"){
    seedMid(3); S.round = 4;
    ["marcus","sophia"].forEach(x => { S.roster[x].st = "out"; S.roster[x].outRound = 2;
      S.roster[x].why = "Voted out in Round 2"; });
    S.drew = p !== "homework";
    if (p === "tardy") pickTardy();
    return go(p);
  }
  if (p === "debrief"){
    seedMid(3); S.round = 4;
    ["marcus","sophia"].forEach(x => { S.roster[x].st = "out"; S.roster[x].outRound = 2;
      S.roster[x].why = "Voted out in Round 2"; });
    S.roster.carlos.st = "out"; S.roster.carlos.outRound = 3; S.roster.carlos.why = "Round 3 \u2014 chose the shift";
    pickTardy();
    return go("debrief");
  }
  go(p);
}

function skySetup(){
  skyC.width = Math.max(1, Math.ceil(innerWidth / SC));
  skyC.height = Math.max(1, Math.ceil(innerHeight / SC));
  const w = skyC.width, h = skyC.height;
  clouds = Array.from({length:9}, () => ({
    x: Math.random()*w, y: 6 + Math.random()*(h*0.62),
    w: 12 + rnd(20), h: 3 + rnd(3), v: 0.05 + Math.random()*0.12
  }));
  stars = Array.from({length:70}, () => ({x: rnd(w), y: rnd(h), p: Math.random()*100}));
}
function skyDraw(){
  const g = skyC.getContext("2d"), w = skyC.width, h = skyC.height;
  g.imageSmoothingEnabled = false;
  g.fillStyle = cssVar("--sky-canvas"); g.fillRect(0,0,w,h);
  if (isDark()){
    stars.forEach(s => {
      s.p += 0.7;
      const on = Math.sin(s.p/22) > -0.4;
      g.fillStyle = on ? cssVar("--cloud") : cssVar("--cloud-2");
      g.fillRect(s.x, s.y, 1, 1);
    });
  } else {
    clouds.forEach(c => {
      if (!RM) c.x += c.v;
      if (c.x > w + c.w) c.x = -c.w;
      g.fillStyle = cssVar("--cloud-2");
      g.fillRect(Math.round(c.x), Math.round(c.y)+c.h, c.w, 2);
      g.fillStyle = cssVar("--cloud");
      g.fillRect(Math.round(c.x), Math.round(c.y), c.w, c.h);
      g.fillRect(Math.round(c.x)+3, Math.round(c.y)-2, c.w-7, 2);
    });
  }
  skyRaf = requestAnimationFrame(skyDraw);
}
addEventListener("resize", () => { skySetup(); });

/* repaint canvas art when the viewer's theme changes (canvases bake their colors) */
const themeQuery = matchMedia("(prefers-color-scheme: dark)");
const repaint = () => render();
if (themeQuery.addEventListener) themeQuery.addEventListener("change", repaint);
new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

/* ==========================================================
   12. BOOT
   ========================================================== */
applyPack(loadPack() || clone(DEFAULT_PACK));
window.__ms = { get S(){ return S; }, go: go, render: render, resetGame: resetGame,
  ALIVE: ALIVE, ACT: ACT };
resetGame(40);
skySetup();
skyDraw();
render();
})();
</script>
