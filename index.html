<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A classroom game about systemic inequality in education, for 30-60 students.">
<title>Mr. System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   MR. SYSTEM - screen deck
   Palette: morning sky + dusk. Earth tones, hard edges, no radii.
   ============================================================ */
:root{
  /* grounds + surfaces (slate-blue-biased neutrals, never pure grey) */
  --ground:#BCD7EE;
  --ground-2:#A8C9E6;
  --panel:#F4E9D2;
  --panel-2:#E8D9B8;
  --panel-3:#DCC9A2;
  --ink:#141C26;
  --ink-2:#3E4C5E;
  --ink-3:#6B7A8C;
  --edge:#141C26;
  --hairline:#B9A981;
  /* accents */
  --sky:#2F6FB0;
  --clay:#B85325;
  --grass:#3B8F55;
  --gold:#DFA018;
  --alarm:#C4332F;
  --violet:#6C4E96;
  /* semantic status */
  --st-in:#3B8F55;
  --st-strug:#C97B14;
  --st-out:#C4332F;
  --st-ghost:#7E8B9B;
  --st-star:#6C4E96;
  --focus:#B85325;
  --sky-canvas:#BCD7EE;
  --cloud:#F4F8FC;
  --cloud-2:#D3E5F4;
  --shadow:6px 6px 0 var(--edge);
  --shadow-sm:4px 4px 0 var(--edge);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D131C;
    --ground-2:#131C28;
    --panel:#1A2532;
    --panel-2:#22303F;
    --panel-3:#2C3D4F;
    --ink:#E6EDF4;
    --ink-2:#B3C2D1;
    --ink-3:#8093A6;
    --edge:#05080C;
    --hairline:#3A4C60;
    --sky:#68A9E0;
    --clay:#E4794A;
    --grass:#5FBF7E;
    --gold:#F0BC46;
    --alarm:#EC5F5A;
    --violet:#A98BD6;
    --st-in:#5FBF7E;
    --st-strug:#F0A93C;
    --st-out:#EC5F5A;
    --st-ghost:#6C7E92;
    --st-star:#A98BD6;
    --focus:#F0BC46;
    --sky-canvas:#0D131C;
    --cloud:#27374A;
    --cloud-2:#1B2836;
  }
}
:root[data-theme="dark"]{
  --ground:#0D131C; --ground-2:#131C28; --panel:#1A2532; --panel-2:#22303F; --panel-3:#2C3D4F;
  --ink:#E6EDF4; --ink-2:#B3C2D1; --ink-3:#8093A6; --edge:#05080C; --hairline:#3A4C60;
  --sky:#68A9E0; --clay:#E4794A; --grass:#5FBF7E; --gold:#F0BC46; --alarm:#EC5F5A; --violet:#A98BD6;
  --st-in:#5FBF7E; --st-strug:#F0A93C; --st-out:#EC5F5A; --st-ghost:#6C7E92; --st-star:#A98BD6;
  --focus:#F0BC46; --sky-canvas:#0D131C; --cloud:#27374A; --cloud-2:#1B2836;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
canvas{display:block}
a{color:var(--clay)}

/* ---------- pixel type ---------- */
.px{font-family:"Press Start 2P","Courier New",monospace;font-weight:400;line-height:1.5;letter-spacing:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shared bits ---------- */
.kaia{
  display:flex;gap:12px;border-left:5px solid var(--violet);background:var(--panel-2);
  padding:12px 14px;margin-bottom:22px;
}
.kaia-who{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--violet);
  flex:none;padding-top:3px;letter-spacing:1px}
.kaia-say{font-size:15px;font-style:italic;color:var(--ink)}
.eyebrow{font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:2px;color:var(--clay)}
.screen-title{font-family:"Press Start 2P",monospace;font-size:clamp(13px,2.6vw,19px);
  line-height:1.45;margin:10px 0 6px}
.hr{height:3px;background:var(--edge);border:0;margin:22px 0;opacity:.85}
.dotrule{height:0;border-top:3px dotted var(--hairline);margin:20px 0}

/* buttons */
.btn{
  font-family:"Press Start 2P",monospace;font-size:11px;line-height:1;cursor:pointer;
  border:4px solid var(--edge);background:var(--gold);color:#141C26;padding:15px 22px;
  box-shadow:var(--shadow-sm);transition:transform .06s steps(2),box-shadow .06s steps(2);
}
.btn:hover{background:var(--clay);color:#FFF6EA}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:none;border-width:3px;font-size:9px;padding:11px 14px}
.btn-ghost:hover{background:var(--ink);color:var(--panel)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border:2px solid currentColor;padding:2px 7px}
.chip canvas{image-rendering:pixelated;width:12px;height:12px}
.c-upper{color:var(--violet)} .c-mid{color:var(--sky)} .c-work{color:var(--clay)} .c-pov{color:var(--alarm)}
.badge{display:inline-flex;align-items:center;gap:7px;font-family:"Press Start 2P",monospace;
  font-size:9px;letter-spacing:.5px;border:3px solid currentColor;padding:6px 9px;line-height:1}
.badge canvas{image-rendering:pixelated;width:14px;height:14px}
.b-in{color:var(--st-in)} .b-strug{color:var(--st-strug)} .b-out{color:var(--st-out)}
.b-ghost{color:var(--st-ghost)} .b-star{color:var(--st-star)}

/* ============ APP SHELL ============ */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
.app{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
@media (min-width:960px){.app{padding:26px 24px 90px}}

.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:"Press Start 2P",monospace;font-size:13px;letter-spacing:1px;
  color:var(--ink);text-shadow:3px 3px 0 var(--clay)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;
  border:2px solid var(--hairline);color:var(--ink-2);padding:4px 9px;text-transform:uppercase;
  background:var(--panel);white-space:nowrap}
.pill b{color:var(--ink)}
.mini{font-family:"Press Start 2P",monospace;font-size:8px;line-height:1;cursor:pointer;
  border:2px solid var(--edge);background:var(--panel);color:var(--ink);padding:8px 10px}
.mini:hover{background:var(--gold);color:#141C26}
.mini[aria-pressed="true"]{background:var(--violet);color:#FFF6EA;border-color:var(--violet)}

/* the game screen frame */
.screen{position:relative;background:var(--panel);border:4px solid var(--edge);
  box-shadow:var(--shadow);overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(to bottom,rgba(20,28,38,.05) 0 2px,transparent 2px 4px);
  mix-blend-mode:multiply}
:root[data-theme="dark"] .screen::after{mix-blend-mode:screen;
  background:repeating-linear-gradient(to bottom,rgba(160,200,240,.045) 0 2px,transparent 2px 4px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .screen::after{mix-blend-mode:screen;
  background:repeating-linear-gradient(to bottom,rgba(160,200,240,.045) 0 2px,transparent 2px 4px)}}
.chrome{display:flex;align-items:center;gap:10px;background:var(--edge);color:#E8EDF4;
  padding:9px 12px;font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:1px;
  position:relative;z-index:4}
.chrome-dot{width:8px;height:8px;background:var(--clay);flex:none}
.chrome-right{margin-left:auto;color:#93A5B8;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:0}
.pad{padding:24px 20px;position:relative;z-index:2}
@media (min-width:760px){.pad{padding:34px 34px}}

/* two-column: dashboard rail + stage */
.layout{display:grid;gap:18px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 292px}}

/* ============ DASHBOARD RAIL ============ */
.dash{background:var(--panel);border:4px solid var(--edge);box-shadow:var(--shadow-sm)}
.dash-head{background:var(--edge);color:#E8EDF4;padding:9px 12px;
  font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:1px}
.dash-body{padding:12px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tally-cell{border:2px solid currentColor;padding:6px 4px;text-align:center}
.tally-n{font-family:"Press Start 2P",monospace;font-size:15px;line-height:1.3}
.tally-l{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;height:12px;border:2px solid var(--edge);margin-bottom:14px;overflow:hidden}
.bar span{display:block;height:100%}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.rrow{display:flex;align-items:center;gap:8px;padding:4px 5px;border:2px solid transparent}
.rrow.is-now{border-color:var(--gold);background:var(--panel-2)}
.rrow canvas{width:20px;height:24px;image-rendering:pixelated;flex:none}
.rrow-name{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow-dot{width:14px;height:14px;flex:none;image-rendering:pixelated}
.rrow.is-out .rrow-name{color:var(--st-ghost);text-decoration:line-through;text-decoration-thickness:2px}
.rrow.is-out canvas{opacity:.45}
.crowd{margin-top:12px;border-top:3px dotted var(--hairline);padding-top:10px}
.crowd-l{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:7px}
.crowd-grid{display:flex;flex-wrap:wrap;gap:2px}
.crowd-grid i{width:8px;height:8px;display:block}

/* ============ CHOICES ============ */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  border:3px solid var(--edge);background:var(--panel-2);color:var(--ink);padding:14px 15px;
  font-family:inherit;font-size:15px;line-height:1.45;
  box-shadow:var(--shadow-sm);transition:transform .06s steps(2),box-shadow .06s steps(2),background .1s}
.choice:hover{background:var(--gold);color:#141C26}
.choice:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
.choice[disabled]{cursor:not-allowed;opacity:.55;box-shadow:none}
.choice-k{font-family:"Press Start 2P",monospace;font-size:13px;flex:none;
  width:30px;height:30px;display:grid;place-items:center;border:3px solid currentColor}
.choice-t{flex:1;min-width:0}
.choice-cost{display:block;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  font-weight:600;letter-spacing:.02em;color:var(--clay)}
.choice:hover .choice-cost{color:#5A2A0E}
.choice-ic{width:20px;height:20px;image-rendering:pixelated;flex:none;margin-top:5px}

/* ============ CHALLENGE ============ */
.chal-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  border:3px solid var(--edge);background:var(--panel-2);padding:14px 16px;margin-bottom:20px}
.clock{font-family:"Press Start 2P",monospace;font-size:clamp(26px,7vw,44px);line-height:1;
  color:var(--st-in);min-width:3.4ch;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--st-strug)}
.clock.crit{color:var(--st-out);animation:blink .5s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.chal-meta{flex:1;min-width:180px}
.chal-diff{display:flex;gap:3px;align-items:center;margin-top:6px}
.chal-diff i{width:11px;height:11px;border:2px solid var(--edge);display:block;background:transparent}
.chal-diff i.on{background:var(--clay)}
.chal-diff span{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;margin-left:6px;color:var(--ink-2)}
.tbar{height:10px;border:2px solid var(--edge);width:100%;margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--st-in);transition:width .95s linear}
.tbar.warn i{background:var(--st-strug)} .tbar.crit i{background:var(--st-out)}
.q{border-left:5px solid var(--sky);background:var(--panel-2);padding:12px 14px;margin-bottom:12px}
.q-n{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--sky);letter-spacing:1px}
.q-t{font-size:15.5px;margin-top:7px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opt{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;cursor:pointer;
  border:3px solid var(--edge);background:var(--panel);color:var(--ink);padding:9px 14px}
.opt:hover{background:var(--sky);color:#FFF}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.field{width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink);
  background:var(--panel);border:3px solid var(--edge);padding:12px 13px;resize:vertical}
.field::placeholder{color:var(--ink-3)}
.hint{font-size:13.5px;color:var(--ink-2);margin-top:9px}

/* ============ RESULTS ============ */
.res{display:flex;gap:14px;border:3px solid var(--edge);background:var(--panel-2);
  padding:14px 15px;margin-bottom:10px;border-left-width:9px}
.res.r-in{border-left-color:var(--st-in)}
.res.r-strug{border-left-color:var(--st-strug)}
.res.r-out{border-left-color:var(--st-out);background:var(--panel-3)}
.res canvas{width:34px;height:40px;image-rendering:pixelated;flex:none}
.res.r-out canvas{opacity:.4}
.res-b{flex:1;min-width:0}
.res-n{font-family:"Press Start 2P",monospace;font-size:11px;letter-spacing:.5px}
.res-say{font-size:14.5px;color:var(--ink-2);margin:7px 0 10px}
.res-say b{color:var(--ink);font-weight:600}
.reveal{opacity:0;transform:translateY(10px);animation:pop .28s steps(4) forwards}
@keyframes pop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

/* ============ VOTING ============ */
.votes{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.votes{grid-template-columns:1fr 1fr}}
.vcard{display:flex;gap:11px;align-items:center;text-align:left;cursor:pointer;
  border:3px solid var(--edge);background:var(--panel-2);color:var(--ink);padding:11px 12px;font-family:inherit}
.vcard:hover{background:var(--gold);color:#141C26}
.vcard[aria-pressed="true"]{background:var(--alarm);color:#FFF3F0;border-color:var(--alarm)}
.vcard canvas{width:26px;height:31px;image-rendering:pixelated;flex:none}
.vcard-n{display:block;font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.4}
.vcard-s{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;margin-top:6px;opacity:.85}
.tallybar{display:flex;align-items:center;gap:10px;margin:7px 0}
.tallybar-n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;width:88px;flex:none}
.tallybar-t{flex:1;height:16px;border:2px solid var(--edge);background:var(--panel-2)}
.tallybar-t i{display:block;height:100%;background:var(--alarm);transition:width .5s steps(8)}
.tallybar-c{font-family:"Press Start 2P",monospace;font-size:10px;width:2ch;text-align:right}
.mimes{border:3px dashed var(--st-ghost);padding:13px 14px;margin-top:20px;background:transparent}
.mimes-h{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--st-ghost);
  letter-spacing:1px;margin-bottom:11px}
.mime-row{display:flex;flex-wrap:wrap;gap:14px}
.mime{display:flex;align-items:center;gap:8px;color:var(--st-ghost);
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-style:italic}
.mime canvas{width:22px;height:26px;image-rendering:pixelated;opacity:.55;animation:sway 1.6s steps(2) infinite}
@keyframes sway{50%{transform:translateX(3px)}}

/* ============ FINAL ROUND ============ */
.bin{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:6px}
.binrow{display:flex;align-items:center;gap:9px;border:3px solid var(--edge);
  background:var(--panel-2);padding:9px 11px;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;font-weight:600}
.binrow canvas{width:16px;height:16px;image-rendering:pixelated;flex:none}
.sketch{border:3px solid var(--edge);background:var(--panel);touch-action:none;cursor:crosshair;
  width:100%;max-width:420px;height:210px;image-rendering:pixelated;display:block}
.eq{display:flex;align-items:flex-end;gap:4px;height:52px}
.eq i{width:9px;background:var(--violet);display:block;animation:eq .7s steps(4) infinite alternate}
.eq i:nth-child(2n){background:var(--sky);animation-duration:.5s}
.eq i:nth-child(3n){background:var(--clay);animation-duration:.9s}
@keyframes eq{from{height:14%}to{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{height:60%}}
.track{position:relative;border:3px solid var(--edge);background:var(--panel-2);
  height:150px;overflow:hidden;margin-top:16px}
.track-line{position:absolute;top:0;bottom:0;width:5px;background:var(--alarm);opacity:.8}
.runner{position:absolute;bottom:12px;transition:left .3s linear;text-align:center}
.runner canvas{width:28px;height:33px;image-rendering:pixelated;animation:hop .34s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-5px)}}
.runner b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  margin-top:2px;white-space:nowrap}

/* ============ DEBRIEF ============ */
.pattern{display:grid;gap:8px;margin:8px 0 4px}
.prow{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center}
.prow-l{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em}
.prow-t{height:20px;border:2px solid var(--edge);background:var(--panel-2);display:flex}
.prow-t i{display:block;height:100%}
.prow-v{font-family:"Press Start 2P",monospace;font-size:10px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.legend i{width:12px;height:12px;border:2px solid var(--edge);display:block}
.cols{display:grid;gap:18px}
@media (min-width:720px){.cols{grid-template-columns:1fr 1fr}}
.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.list li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.list canvas{width:14px;height:14px;image-rendering:pixelated;flex:none;margin-top:4px}
.list .who{font-weight:600}
.list .why{color:var(--ink-2)}
.qs{counter-reset:q;list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.qs li{counter-increment:q;display:flex;gap:12px;font-size:15.5px;line-height:1.5}
.qs li::before{content:counter(q);font-family:"Press Start 2P",monospace;font-size:11px;
  color:var(--clay);flex:none;border:3px solid var(--clay);width:30px;height:30px;
  display:grid;place-items:center}
.note{border-left:5px solid var(--clay);background:var(--panel-2);padding:13px 15px;
  font-size:14px;color:var(--ink-2);margin-top:20px}
.note b{color:var(--ink)}

/* ============ SETUP / CAST ============ */
.setup-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0 6px}
.stepper{display:flex;align-items:center;gap:0;border:3px solid var(--edge);background:var(--panel-2)}
.stepper button{font-family:"Press Start 2P",monospace;font-size:13px;cursor:pointer;border:0;
  background:transparent;color:var(--ink);padding:12px 16px;line-height:1}
.stepper button:hover{background:var(--gold);color:#141C26}

/* ==========================================================
   5. STATE
   ========================================================== */
const ORDER = CAST.map(c => c.id);
const S = {
  phase:"title", classSize:40, round:1, qi:0,
  roster:{}, crowd:[], pending:null, chal:null,
  voteSel:null, tally:null, eliminated:null,
  drew:false, tardy:null, musicT:0
};
function resetGame(size){
  S.classSize = size || S.classSize;
  S.round = 1; S.qi = 0; S.pending = null; S.chal = null;
  S.voteSel = null; S.tally = null; S.eliminated = null;
  S.drew = false; S.tardy = null; S.musicT = 0;
  S.roster = {};
  CAST.forEach(c => S.roster[c.id] = {st:"in", hist:[], outRound:null, why:""});
  const n = Math.max(0, S.classSize - CAST.length);
  const mix = ["upper","upper","upper","work","work","work","pov","pov","pov","pov"];
  S.crowd = Array.from({length:n}, (_,i) => ({tier:mix[i % mix.length], st:"in"}));
}
const ALIVE = () => CAST.filter(c => S.roster[c.id].st !== "out");
const DEAD  = () => CAST.filter(c => S.roster[c.id].st === "out");
const rnd = n => Math.floor(Math.random()*n);

const CROWD_ODDS = {upper:[0.88,0.12,0.00], work:[0.34,0.45,0.21], pov:[0.10,0.38,0.52]};
function stepCrowd(){
  S.crowd.forEach(p => {
    if (p.st === "out") return;
    const o = CROWD_ODDS[p.tier], r = Math.random();
    p.st = r < o[0] ? "in" : r < o[0]+o[1] ? "strug" : "out";
  });
}
function counts(){
  const c = {in:0,strug:0,out:0};
  CAST.forEach(x => c[S.roster[x.id].st]++);
  S.crowd.forEach(x => c[x.st]++);
  return c;
}

/* ==========================================================
   6. RENDER HELPERS
   ========================================================== */
const root = document.getElementById("root");
const hud  = document.getElementById("hud");
const overlay = document.getElementById("overlay");
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const SP = (id,px,ghost) => `<span data-sprite="${id}" data-px="${px||3}"${ghost?' data-ghost="1"':""}></span>`;
const IC = (n,px,col) => `<span data-icon="${n}" data-px="${px||2}"${col?` data-color="${col}"`:""}></span>`;
const ST_LABEL = {in:"IN SCHOOL", strug:"STRUGGLING", out:"OUT OF SCHOOL"};
const ST_CLASS = {in:"b-in", strug:"b-strug", out:"b-out"};
const ST_VAR   = {in:"--st-in", strug:"--st-strug", out:"--st-out"};
function badge(st, label){
  return `<span class="badge ${ST_CLASS[st]}">${IC(iconFor(st),2)}${esc(label || ST_LABEL[st])}</span>`;
}
function screen(title, right, body){
  return `<div class="screen"><div class="chrome"><span class="chrome-dot"></span>${esc(title)}
    <span class="chrome-right">${esc(right||"")}</span></div><div class="pad">${body}</div></div>`;
}
function kaia(text){
  return `<div class="kaia"><span class="kaia-who">KAIA</span><p class="kaia-say">${esc(text)}</p></div>`;
}
function hydrate(el){
  el.querySelectorAll("[data-sprite]").forEach(n => {
    if (n.firstChild) return;
    const ch = BY_ID[n.dataset.sprite]; if (!ch) return;
    n.appendChild(sprite(ch, +(n.dataset.px || 3), n.dataset.ghost === "1"));
  });
  el.querySelectorAll("[data-icon]").forEach(n => {
    if (n.firstChild) return;
    const raw = n.dataset.color;
    const col = raw ? (raw.startsWith("--") ? cssVar(raw) : raw) : getComputedStyle(n).color;
    n.appendChild(icon(n.dataset.icon, +(n.dataset.px || 2), col, cssVar("--panel")));
  });
}

/* dashboard rail */
function dash(opts){
  opts = opts || {};
  const c = counts(), total = S.classSize;
  const pct = k => total ? (c[k]/total*100) : 0;
  const rows = CAST.map(ch => {
    const r = S.roster[ch.id], out = r.st === "out";
    return `<li class="rrow ${out?"is-out":""} ${opts.now===ch.id?"is-now":""}">
      ${SP(ch.id, 2, out)}
      <span class="rrow-name">${esc(ch.name)}</span>
      <span class="rrow-dot" style="color:${cssVar(ST_VAR[r.st])}" title="${ST_LABEL[r.st]}">
        ${IC(iconFor(r.st), 2)}</span>
      <span class="sr">${ST_LABEL[r.st]}</span></li>`;
  }).join("");
  const crowdCells = S.crowd.map(p =>
    `<i style="background:${cssVar(ST_VAR[p.st])}" title="${ST_LABEL[p.st]}"></i>`).join("");
  return `<aside class="dash"><div class="dash-head">CLASS STATUS &mdash; ROUND ${S.round}</div>
    <div class="dash-body">
      <div class="tally">
        <div class="tally-cell b-in"><div class="tally-n">${c.in}</div><div class="tally-l">In</div></div>
        <div class="tally-cell b-strug"><div class="tally-n">${c.strug}</div><div class="tally-l">Strug</div></div>
        <div class="tally-cell b-out"><div class="tally-n">${c.out}</div><div class="tally-l">Out</div></div>
      </div>
      <div class="bar" role="img" aria-label="${c.in} in school, ${c.strug} struggling, ${c.out} out, of ${total}">

V.challenge = () => {

    body = c.qs.map((q,qi) => `<div class="q"><div class="q-n">QUESTION ${qi+1}</div>
      <div class="q-t">${esc(q.q)}</div><div class="opts">${q.opts.map((o,oi) =>
        `<button class="opt" data-act="opt" data-q="${qi}" data-o="${oi}"
          aria-pressed="${t.answers[qi]===oi}">${esc(o)}</button>`).join("")}</div></div>`).join("")
      + `<div class="actions"><button class="btn" data-act="submit">SUBMIT</button></div>`;
  } else if (c.kind === "list"){
    body = `<label class="q-t" for="listIn" style="display:block;margin-bottom:9px">${esc(c.brief)}</label>
      <textarea class="field" id="listIn" rows="3" placeholder="${esc(c.placeholder)}"></textarea>
      <p class="hint">You need ${c.need}. Partial credit is not a thing here.</p>
      <div class="actions"><button class="btn" data-act="submit">SUBMIT</button></div>`;

    const q = c.qs[t.step];
    body = q ? `<div class="q"><div class="q-n">${t.step+1} OF ${c.qs.length}</div>
      <div class="q-t">${esc(q.q)}</div><div class="opts">${q.opts.map((o,oi) =>

   7.5 CONTENT PACK
   Everything a professor can rewrite, in one JSON object.
   Saved in this browser; exportable as a file to share.
   ========================================================== */
const PACK_KEY = "mrsystem.pack.v1";
const clone = o => JSON.parse(JSON.stringify(o));
const BASE_CAST = CAST.map(c => Object.assign({}, c));
const CAST_FIELDS = ["name","cls","tier","who","tags","load"];

function packFromLive(){
  return {
    version: 1,
    pass: "mrsystem",
    cast: CAST.map(c => ({id:c.id, name:c.name, cls:c.cls, tier:c.tier, who:c.who,
                          tags:c.tags.slice(), load:c.load})),
    rounds: {1:{name:ROUND_NAME[1], kaia:ROUND_KAIA[1]},
             2:{name:ROUND_NAME[2], kaia:ROUND_KAIA[2]},
             3:{name:ROUND_NAME[3], kaia:ROUND_KAIA[3]}},
    dilemmas: clone(DILEMMAS),
    challenges: clone(CHALLENGES),
    priv: clone(PRIV),
    tardyWhy: clone(TARDY_WHY),
    text: clone(TEXT)
  };
}
const DEFAULT_PACK = packFromLive();
let PACK = clone(DEFAULT_PACK);

/** Fill any gaps from the defaults so a partial or older pack still loads. */
function mergePack(p){
  const d = clone(DEFAULT_PACK);
  if (!p || typeof p !== "object") return d;
  ["pass","cast","rounds"].forEach(k => { if (p[k] != null) d[k] = clone(p[k]); });
  /* per-key merges: a pack saved before new characters or challenges shipped
     keeps its edits AND picks up everything it has never heard of */
  if (p.dilemmas) [1,2,3].forEach(r => {
    if (p.dilemmas[r]) d.dilemmas[r] = Object.assign({}, d.dilemmas[r], clone(p.dilemmas[r]));
  });
  ["challenges","priv","tardyWhy"].forEach(k => {
    if (p[k]) d[k] = Object.assign({}, d[k], clone(p[k]));
  });
  if (p.text) d.text = Object.assign(clone(DEFAULT_PACK.text), clone(p.text));
  return d;
}
function applyPack(p){
  PACK = p;
  CAST = BASE_CAST.map(b => {
    const e = (p.cast || []).find(x => x.id === b.id) || {};
    const merged = Object.assign({}, b);
    CAST_FIELDS.forEach(f => { if (e[f] != null) merged[f] = e[f]; });
    return merged;
  });
  BY_ID = Object.fromEntries(CAST.map(c => [c.id, c]));
  DILEMMAS = p.dilemmas;
  CHALLENGES = p.challenges;
  ROUND_NAME = {1:p.rounds[1].name, 2:p.rounds[2].name, 3:p.rounds[3].name};
  ROUND_KAIA = {1:p.rounds[1].kaia, 2:p.rounds[2].kaia, 3:p.rounds[3].kaia};
  PRIV = p.priv;
  TARDY_WHY = p.tardyWhy;
  TEXT = p.text;
}
function savePack(p){
  try { localStorage.setItem(PACK_KEY, JSON.stringify(p)); return true; }
  catch (e) { return false; }
}
function loadPack(){
  try {
    const raw = localStorage.getItem(PACK_KEY);
    return raw ? mergePack(JSON.parse(raw)) : null;
  } catch (e) { return null; }
}
function clearPack(){ try { localStorage.removeItem(PACK_KEY); } catch (e) {} }
const isEdited = () => JSON.stringify(PACK) !== JSON.stringify(DEFAULT_PACK);

/* ---- editor mutations ---- */
function edSwitchChallenge(i, key){
  const d = ED.draft.dilemmas[ED.sel.round][ED.sel.dil], c = d.choices[i];
  if (!key){
    const from = c.auto || c.pass || c.fail || {st:"in", say:""};
    d.choices[i] = {k:c.k, t:c.t, cost:c.cost, icon:c.icon, auto:{st:from.st, say:from.say}};
  } else {
    const from = c.auto || c.pass || {st:"in", say:""};
    const bad  = c.fail || {st:"strug", say:""};
    d.choices[i] = {k:c.k, t:c.t, cost:c.cost, icon:c.icon, chal:key,
                    pass:{st:from.st, say:from.say}, fail:{st:bad.st, say:bad.say}};
  }
}
async function edExport(){
  const json = JSON.stringify(ED.draft, null, 2);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }

    await dl.save({filename:"mr-system-content.json", data:json});

  catch (e) {

}
function edImport(){
  const box = document.getElementById("edJson");

/* ==========================================================
   8. ENGINE
   ========================================================== */
let tick = null;
function clearTick(){ if (tick){ clearInterval(tick); tick = null; } }

function render(){
  clearTick();
  const view = V[S.phase] || V.title;
  root.innerHTML = view();
  hydrate(root);
  renderHud();
  if (S.phase === "challenge") startTimer();
  if (S.phase === "homework") initSketch();
  if (S.phase === "music") startMusic();
  const h = root.querySelector(".screen-title");
  if (h) { h.setAttribute("tabindex","-1"); }
  window.scrollTo({top:0, behavior: RM ? "auto" : "smooth"});
}
function renderHud(){
  const c = counts(), showing = ["intro","dilemma","challenge","outcome","results","vote","voteres",
                                 "homework","music","tardy"].indexOf(S.phase) >= 0;
  hud.innerHTML = `${showing ? `<span class="pill">ROUND <b>${S.round>3?"FINAL":S.round}</b></span>
    <span class="pill">IN <b>${c.in}</b></span><span class="pill">OUT <b>${c.out}</b></span>` : ""}
    <button class="mini" data-act="theme" title="Switch between morning and dusk">${themeIsDark() ? "DUSK" : "MORNING"}</button>
    <button class="mini${isEdited() ? " is-live" : ""}" data-act="prof"
      title="${isEdited() ? "Running an edited content pack" : "Rewrite the game's content"}">PROF EDIT</button>
    <button class="mini" data-act="index">SCREEN INDEX</button>
    <button class="mini" data-act="restart">RESTART</button>`;
}
function go(p){ S.phase = p; render(); }

/* ---- round flow ---- */
const playable = id => S.roster[id].st !== "out" && !!dilemmaFor(id);
function nextQuestion(){
  while (S.qi < CAST.length && !playable(CAST[S.qi].id)) S.qi++;
  if (S.qi >= CAST.length){ stepCrowd(); go("results"); return; }
  go("dilemma");
}
function advance(){ S.qi++; nextQuestion(); }

function choose(i){
  const ch = CAST[S.qi], d = dilemmaFor(ch.id), c = d.choices[i];
  if (c.auto){ resolve(ch, c, c.auto, null); return; }
  const def = CHALLENGES[c.chal];
  S.chal = {def: def, left: def.secs, endAt: Date.now() + def.secs * 1000,
            answers: {}, step: 0, choice: c, ch: ch};
  go("challenge");
}
function resolve(ch, choice, out, chalNote){
  const r = S.roster[ch.id];
  r.st = out.st;
  r.hist.push({round:S.round, k:choice.k, st:out.st, say:out.say});
  if (out.st === "out" && r.outRound === null){
    r.outRound = S.round;
    r.why = "Round " + S.round + " \u2014 chose: " + choice.t;
  }
  S.pending = {id:ch.id, k:choice.k, title:choice.t, say:out.say, st:out.st, chalNote:chalNote};
  go("outcome");
}
function finishChallenge(passed){
  clearTick();
  const t = S.chal, c = t.choice, def = t.def;
  const out = passed ? c.pass : c.fail;
  const note = def.kind === "list"
    ? (passed ? `You named enough of them in time.` : `You ran out of time before you had ${def.need}.`)
    : def.kind === "rapid"
      ? (passed ? `You handled ${t.step} of ${def.qs.length} before the clock ran out.`
                : `You got through ${t.step} of ${def.qs.length}. The rest happened without you.`)
      : (passed ? `Challenge passed.` : `Challenge failed \u2014 and notice what that does and doesn't cost you.`);
  S.chal = null;
  resolve(t.ch, c, out, note);
}
function scoreChallenge(){
  const t = S.chal, def = t.def;
  if (def.kind === "quiz"){
    let ok = 0;
    def.qs.forEach((q,i) => { if (t.answers[i] === q.a) ok++; });
    return ok >= def.need;
  }
  if (def.kind === "list"){
    const el = document.getElementById("listIn");
    const raw = (el ? el.value : "").toLowerCase();
    const toks = raw.split(/[,\n;]+/).map(s => s.trim()).filter(s => s.length >= 3);
    const hits = def.keys.filter(k => raw.indexOf(k) >= 0).length;
    return Math.max(toks.length, hits) >= def.need;
  }
  return t.step >= def.need;
}
function startTimer(){
  const t = S.chal; if (!t) return;
  const clock = document.getElementById("clock"), tbar = document.getElementById("tbar");
  const paint = () => {
    if (!clock) return;
    t.left = Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000));
    const frac = t.left / t.def.secs;
    const cls = frac > .5 ? "" : frac > .25 ? "warn" : "crit";
    clock.className = "clock " + cls; clock.textContent = t.left;
    if (tbar){ tbar.className = "tbar " + cls; tbar.firstElementChild.style.width = (frac*100) + "%"; }
  };
  paint();
  tick = setInterval(() => {
    paint();
    if (t.left <= 0){ clearTick(); finishChallenge(scoreChallenge()); }
  }, 250);
}

/* ---- voting ---- */
function runVote(){
  const alive = ALIVE();
  const weight = ch => {
    const r = S.roster[ch.id];
    let w = 1;
    if (r.st === "strug") w += 2.6;
    if (ch.tier === "pov") w += 2.2;
    if (ch.tier === "work") w += 0.9;
    if (ch.tier === "upper") w -= 0.55;
    return Math.max(0.15, w);
  };
  const tally = alive.map(ch => ({id:ch.id, n:0}));
  const idx = Object.fromEntries(tally.map((t,i) => [t.id, i]));
  tally[idx[S.voteSel]].n = 1;                       // the player's family
  const others = alive.length - 1;                   // every other surviving family votes
  const pool = alive.map(ch => ({id:ch.id, w:weight(ch)}));
  const total = pool.reduce((a,b) => a + b.w, 0);
  for (let v = 0; v < others; v++){
    let r = Math.random() * total, pick = pool[0].id;
    for (const p of pool){ r -= p.w; if (r <= 0){ pick = p.id; break; } }
    tally[idx[pick]].n++;
  }
  tally.sort((a,b) => b.n - a.n || weight(BY_ID[b.id]) - weight(BY_ID[a.id]));
  S.tally = tally;
  S.eliminated = tally[0].id;
  const r = S.roster[S.eliminated];
  r.st = "out"; r.outRound = S.round; r.why = "Voted out in Round " + S.round;
  r.hist.push({round:S.round, k:"\u2014", st:"out", say:"Voted out by the surviving families."});
  go("voteres");
}
function afterVote(){
  if (S.round < 3){ S.round++; S.qi = 0; go("intro"); }
  else { S.round = 4; go("homework"); }
}

/* ---- final round ---- */
function initSketch(){
  const cv = document.getElementById("sketch"); if (!cv) return;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.round(rect.width); cv.height = Math.round(rect.height);
  const g = cv.getContext("2d");
  g.fillStyle = cssVar("--panel"); g.fillRect(0,0,cv.width,cv.height);
  g.strokeStyle = cssVar("--ink"); g.lineWidth = 4; g.lineCap = "round"; g.lineJoin = "round";
  let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e; return [p.clientX - r.left, p.clientY - r.top]; };
  const down = e => { drawing = true; S.drew = true; const [x,y] = pos(e); g.beginPath(); g.moveTo(x,y); e.preventDefault(); };
  const move = e => { if (!drawing) return; const [x,y] = pos(e); g.lineTo(x,y); g.stroke(); e.preventDefault(); };
  const up = () => { drawing = false; };
  cv.addEventListener("mousedown", down); cv.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, {passive:false});
  cv.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("touchend", up);
}
function startMusic(){
  const alive = ALIVE();
  S.musicT = 12;
  const clock = document.getElementById("clock");
  const step = () => {
    if (clock) clock.textContent = S.musicT;
    alive.forEach((ch,i) => {
      const el = document.getElementById("run-" + ch.id); if (!el) return;
      const speed = PRIV[ch.id] ? 4 : 9 + (ch.load || 3);
      const base = 6 + i * (80 / Math.max(1, alive.length));
      el.style.left = Math.max(3, Math.min(90, base + (RM ? 0 : (Math.random()*2-1) * speed))) + "%";
    });
    S.musicT--;
    if (S.musicT < 0){ clearTick(); pickTardy(); go("tardy"); }
  };
  step();
  tick = setInterval(step, RM ? 400 : 700);
}
function pickTardy(){
  const alive = ALIVE().filter(c => !PRIV[c.id]);
  const pool = alive.length ? alive : ALIVE();
  const last = pool.slice().sort((a,b) =>
    (b.load + (S.roster[b.id].st === "strug" ? 1.5 : 0)) - (a.load + (S.roster[a.id].st === "strug" ? 1.5 : 0)))[0];
  S.tardy = last.id;
  const r = S.roster[last.id];
  r.st = "out"; r.outRound = 4; r.why = "Final round \u2014 tardy";
  r.hist.push({round:4, k:"\u2014", st:"out", say:"Last one in when the music stopped."});
}

/* ==========================================================
   9. INPUT
   ========================================================== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "go"){ go(b.dataset.to); }
  else if (a === "size"){
    S.classSize = Math.max(30, Math.min(60, S.classSize + (+b.dataset.d)));
    resetGame(S.classSize);
    const o = document.getElementById("sizeOut"), g = document.getElementById("bgOut"),
          f = document.getElementById("fgOut");
    if (o) o.textContent = S.classSize;
    if (g) g.textContent = S.classSize - CAST.length;
    if (f) f.textContent = Math.ceil(S.classSize/5);
  }
  else if (a === "startround"){ S.round = 1; S.qi = 0; go("intro"); }
  else if (a === "nextq"){ S.phase === "intro" ? nextQuestion() : advance(); }
  else if (a === "choose"){ choose(+b.dataset.i); }
  else if (a === "opt"){
    const q = +b.dataset.q, o = +b.dataset.o;
    S.chal.answers[q] = o;
    b.parentElement.querySelectorAll(".opt").forEach(x =>
      x.setAttribute("aria-pressed", String(+x.dataset.o === o)));
  }
  else if (a === "rapid"){ S.chal.step++; render(); }
  else if (a === "submit"){ finishChallenge(scoreChallenge()); }
  else if (a === "vote"){ S.voteSel = b.dataset.id; render(); }
  else if (a === "submitvote"){ if (S.voteSel) runVote(); }
  else if (a === "afterVote"){ afterVote(); }
  else if (a === "submithw"){ go("music"); }
  else if (a === "clearhw"){ S.drew = false; initSketch(); render(); }
  else if (a === "restart"){ resetGame(S.classSize); go("title"); }
  else if (a === "theme"){
    document.documentElement.setAttribute("data-theme", themeIsDark() ? "light" : "dark");
    render();
  }
  else if (a === "prof"){ openEditor(); }
  else if (a === "index"){ openIndex(); }
  else if (a === "closeindex"){ overlay.innerHTML = ""; }
  else if (a === "jump"){ overlay.innerHTML = ""; jumpTo(b.dataset.p, b.dataset.id); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && overlay.innerHTML) overlay.innerHTML = "";
  if (e.key === "Escape" && ED.open) closeEditor();
  if (e.key === "Enter" && ED.open && !ED.unlocked){
    e.preventDefault();
    const btn = edroot.querySelector('[data-ed="unlock"]');
    if (btn) btn.click();
  }
  if (e.key === "Enter" && S.phase === "challenge" && S.chal && S.chal.def.kind === "list"
      && document.activeElement && document.activeElement.id === "listIn" && !e.shiftKey){
    e.preventDefault(); finishChallenge(scoreChallenge());
  }
});

/* ==========================================================
   10. SCREEN INDEX  (jump straight to any screen, for review)
   ========================================================== */
const INDEX = [
  ["01","Title / intro","title"], ["02","Setup \u2014 class size","setup"],
  ["03","Character assignment","cast"], ["04","Round intro","intro"],
  ["05","Dilemma \u2014 David (easy)","dilemma","david"],
  ["06","Dilemma \u2014 Marcus (impossible)","dilemma","marcus"],
  ["07","Challenge \u2014 timed","challenge","marcus"],
  ["08","Outcome \u2014 Lucia","outcome","lucia"],
  ["09","Round results","results"], ["10","Voting","vote"], ["11","Vote result","voteres"],
  ["12","Final \u2014 homework","homework"], ["13","Final \u2014 musical chairs","music"],
  ["14","Final \u2014 tardy","tardy"], ["15","Debrief","debrief"]
];
function openIndex(){
  overlay.innerHTML = `<div class="idx" role="dialog" aria-modal="true" aria-label="Screen index">
    <div class="idx-panel"><p class="eyebrow">FOR REVIEW</p>
      <h2 class="screen-title" style="font-size:14px">SCREEN INDEX</h2>
      <p style="font-size:14px;color:${cssVar("--ink-2")};margin-top:8px">Jump to any screen with a plausible
        game state behind it. Play resumes from wherever you land.</p>
      <div class="idx-grid">${INDEX.map(r => `<button class="idx-b" data-act="jump" data-p="${r[2]}"
        ${r[3]?`data-id="${r[3]}"`:""}><em>${r[0]}</em><span>${esc(r[1])}</span></button>`).join("")}</div>
      <div class="actions"><button class="btn btn-ghost" data-act="closeindex">CLOSE</button></div>
    </div></div>`;
  hydrate(overlay);
}
function seedMid(round){
  resetGame(S.classSize);
  S.round = round || 2;
  ["lucia","jayson"].forEach(id => { S.roster[id].st = "out"; S.roster[id].outRound = 1;
    S.roster[id].why = "Round 1 \u2014 every option led out";
    S.roster[id].hist.push({round:1,k:"B",st:"out",say:DILEMMAS[1][id].choices[1].auto.say}); });
  const pick = (id, want) => {
    const cs = DILEMMAS[1][id].choices;
    for (const c of cs) if (c.auto && c.auto.st === want) return {k:c.k, say:c.auto.say};
    for (const c of cs) if (c.pass && c.pass.st === want) return {k:c.k, say:c.pass.say};
    for (const c of cs) if (c.fail && c.fail.st === want) return {k:c.k, say:c.fail.say};
    return {k:"A", say:"Made it in, at a cost nobody recorded."};
  };
  ["marcus","isabella","carlos","sophia"].forEach(id => { S.roster[id].st = "strug";
    const o = pick(id,"strug"); S.roster[id].hist.push({round:1,k:o.k,st:"strug",say:o.say}); });
  ["david","alejandra","priya","chase"].forEach(id => {
    const o = pick(id,"in"); S.roster[id].hist.push({round:1,k:o.k,st:"in",say:o.say}); });
  stepCrowd();
}
function jumpTo(p, id){
  if (p === "title" || p === "setup" || p === "cast"){ resetGame(S.classSize); return go(p); }
  if (p === "intro"){ seedMid(2); return go("intro"); }
  if (p === "dilemma"){ seedMid(1); S.round = 1; S.qi = ORDER.indexOf(id||"david");
    S.roster[id||"david"].st = "in"; return go("dilemma"); }
  if (p === "challenge"){ seedMid(1); S.round = 1; S.qi = ORDER.indexOf("marcus");
    S.roster.marcus.st = "in";
    const c = DILEMMAS[1].marcus.choices[0];
    S.chal = {def:CHALLENGES[c.chal], left:CHALLENGES[c.chal].secs,
              endAt: Date.now() + CHALLENGES[c.chal].secs * 1000,
              answers:{}, step:0, choice:c, ch:BY_ID.marcus};
    return go("challenge"); }
  if (p === "outcome"){ seedMid(1); S.round = 1;
    const c = DILEMMAS[1].lucia.choices[1];
    S.pending = {id:"lucia", k:"B", title:c.t, say:c.auto.say, st:"out",
      chalNote:"There was no challenge. There was nothing to win."};
    return go("outcome"); }
  if (p === "results"){ seedMid(1); S.round = 1; return go("results"); }
  if (p === "vote"){ seedMid(1); S.round = 1; S.voteSel = "marcus"; return go("vote"); }
  if (p === "voteres"){ seedMid(1); S.round = 1; S.voteSel = "marcus"; return runVote(); }
  if (p === "homework" || p === "music" || p === "tardy"){
    seedMid(3); S.round = 4;
    ["marcus","sophia"].forEach(x => { S.roster[x].st = "out"; S.roster[x].outRound = 2;
      S.roster[x].why = "Voted out in Round 2"; });
    S.drew = p !== "homework";
    if (p === "tardy") pickTardy();
    return go(p);
  }
  if (p === "debrief"){
    seedMid(3); S.round = 4;
    ["marcus","sophia"].forEach(x => { S.roster[x].st = "out"; S.roster[x].outRound = 2;
      S.roster[x].why = "Voted out in Round 2"; });
    S.roster.carlos.st = "out"; S.roster.carlos.outRound = 3; S.roster.carlos.why = "Round 3 \u2014 chose the shift";
    pickTardy();
    return go("debrief");
  }
  go(p);
}


/* ---- editor events ---- */
edroot.addEventListener("input", e => {
  const el = e.target.closest("[data-path]");
  if (!el || !ED.draft) return;
  const path = el.dataset.path;
  let val = el.value;
  if (path.indexOf("__sel.") === 0){
    const k = path.slice(6);
    ED.sel[k] = k === "round" ? +val : val;
    ED.msg = "";
    return renderEd();
  }
  if (/\.__kind$/.test(path)){
    const ks = path.split(".");
    edSwitchChallenge(+ks[ks.length - 2], val);
    return renderEd();
  }
  if (el.dataset.num){
    const n = parseInt(val, 10);
    val = isNaN(n) ? +el.min : Math.max(+el.min, Math.min(+el.max, n));
  }
  if (/^challenges\.[^.]+\.keys$/.test(path)){
    return setP(ED.draft, path, val.split(",").map(x => x.trim()).filter(Boolean));
  }
  if (/^challenges\..*\.a$/.test(path)) return setP(ED.draft, path, +val);
  setP(ED.draft, path, val);
});
edroot.addEventListener("click", e => {
  const b = e.target.closest("[data-ed]");
  if (!b) return;
  const a = b.dataset.ed, D = ED.draft;
  const chIdx = () => D.cast.findIndex(c => c.id === ED.sel.ch);
  const dil = () => D.dilemmas[ED.sel.round][ED.sel.dil];
  if (a === "close") return closeEditor();
  if (a === "unlock"){
    const f = document.getElementById("edPass");
    const got = (f ? f.value : "").trim().toLowerCase();
    if (got && got === String(PACK.pass || "mrsystem").trim().toLowerCase()){
      ED.unlocked = true; ED.msg = "";
      try { sessionStorage.setItem(UNLOCK_KEY, "1"); } catch (err) {}
      ED.draft = clone(PACK);
    } else ED.msg = "That passcode doesn't match.";
    return renderEd();
  }
  if (a === "tab"){ ED.tab = b.dataset.t; ED.msg = ""; return renderEd(); }
  if (a === "save"){
    applyPack(mergePack(D));
    ED.draft = clone(PACK);
    ED.msg = savePack(PACK) ? "Saved. The game is running your version."
                            : "Applied, but this browser blocked saving \u2014 export the file to keep it.";
    render(); return renderEd();
  }
  if (a === "revert"){ ED.draft = clone(PACK); ED.msg = "Changes discarded."; return renderEd(); }
  if (a === "reset"){
    applyPack(clone(DEFAULT_PACK)); clearPack();
    ED.draft = clone(PACK); ED.msg = "Back to the original content.";
    render(); return renderEd();
  }
  if (a === "export") return edExport();
  if (a === "copy") return edCopy();
  if (a === "import") return edImport();
  if (a === "addtag"){ D.cast[chIdx()].tags.push("New marker"); return renderEd(); }
  if (a === "deltag"){ D.cast[chIdx()].tags.splice(+b.dataset.i, 1); return renderEd(); }
  if (a === "addchoice"){
    const d = dil();
    const letters = "ABCDEFGH";
    d.choices.push({k: letters[d.choices.length] || "?", t: "New choice", cost: "Say what it costs.",
                    icon: "warn", auto: {st: "strug", say: "Write what Kaia reads out here."}});
    return renderEd();
  }
  if (a === "delchoice"){ dil().choices.splice(+b.dataset.i, 1); return renderEd(); }
  if (a === "addq"){
    const def = D.challenges[ED.sel.chal];
    const q = {q: "New question", opts: ["Option 1", "Option 2", "Option 3"]};
    if (def.kind === "quiz") q.a = 0;
    def.qs.push(q); return renderEd();
  }
  if (a === "delq"){ D.challenges[ED.sel.chal].qs.splice(+b.dataset.i, 1); return renderEd(); }
  if (a === "addq2"){ D.text.questions.push("New reflection question"); return renderEd(); }
  if (a === "delq2"){ D.text.questions.splice(+b.dataset.i, 1); return renderEd(); }
});

/* ==========================================================
   11. AMBIENT SKY  (drifting pixel clouds / dusk stars)
   ========================================================== */
const skyC = document.getElementById("sky");
const isDark = themeIsDark;
let clouds = [], stars = [], skyRaf = 0, SC = 6;
function skySetup(){
  skyC.width = Math.max(1, Math.ceil(innerWidth / SC));
  skyC.height = Math.max(1, Math.ceil(innerHeight / SC));
  const w = skyC.width, h = skyC.height;
  clouds = Array.from({length:9}, () => ({
    x: Math.random()*w, y: 6 + Math.random()*(h*0.62),
    w: 12 + rnd(20), h: 3 + rnd(3), v: 0.05 + Math.random()*0.12
  }));
  stars = Array.from({length:70}, () => ({x: rnd(w), y: rnd(h), p: Math.random()*100}));
}
function skyDraw(){
  const g = skyC.getContext("2d"), w = skyC.width, h = skyC.height;
  g.imageSmoothingEnabled = false;
  g.fillStyle = cssVar("--sky-canvas"); g.fillRect(0,0,w,h);
  if (isDark()){
    stars.forEach(s => {
      s.p += 0.7;
      const on = Math.sin(s.p/22) > -0.4;
      g.fillStyle = on ? cssVar("--cloud") : cssVar("--cloud-2");
      g.fillRect(s.x, s.y, 1, 1);
    });
  } else {
    clouds.forEach(c => {
      if (!RM) c.x += c.v;
      if (c.x > w + c.w) c.x = -c.w;
      g.fillStyle = cssVar("--cloud-2");
      g.fillRect(Math.round(c.x), Math.round(c.y)+c.h, c.w, 2);
      g.fillStyle = cssVar("--cloud");
      g.fillRect(Math.round(c.x), Math.round(c.y), c.w, c.h);
      g.fillRect(Math.round(c.x)+3, Math.round(c.y)-2, c.w-7, 2);
    });
  }
  skyRaf = requestAnimationFrame(skyDraw);
}
addEventListener("resize", () => { skySetup(); });

/* repaint canvas art when the viewer's theme changes (canvases bake their colors) */
const themeQuery = matchMedia("(prefers-color-scheme: dark)");
const repaint = () => render();
if (themeQuery.addEventListener) themeQuery.addEventListener("change", repaint);
new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

/* ==========================================================
   12. BOOT
   ========================================================== */
applyPack(loadPack() || clone(DEFAULT_PACK));
resetGame(40);
skySetup();
skyDraw();
render();
})();
</script>
