<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A classroom game about systemic inequality in education, for 30-60 students.">
<title>Mr. System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   MR. SYSTEM - screen deck
   Palette: morning sky + dusk. Earth tones, hard edges, no radii.
   ============================================================ */
:root{
  /* grounds + surfaces (slate-blue-biased neutrals, never pure grey) */
  --ground:#BCD7EE;
  --ground-2:#A8C9E6;
  --panel:#F4E9D2;
  --panel-2:#E8D9B8;
  --panel-3:#DCC9A2;
  --ink:#141C26;
  --ink-2:#3E4C5E;
  --ink-3:#6B7A8C;
  --edge:#141C26;
  --hairline:#B9A981;
  /* accents */
  --sky:#2F6FB0;
  --clay:#B85325;
  --grass:#3B8F55;
  --gold:#DFA018;
  --alarm:#C4332F;
  --violet:#6C4E96;
  /* semantic status */
  --st-in:#3B8F55;
  --st-strug:#C97B14;
  --st-out:#C4332F;
  --st-ghost:#7E8B9B;
  --st-star:#6C4E96;
  --focus:#B85325;
  --sky-canvas:#BCD7EE;
  --cloud:#F4F8FC;
  --cloud-2:#D3E5F4;
  --shadow:6px 6px 0 var(--edge);
  --shadow-sm:4px 4px 0 var(--edge);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D131C;
    --ground-2:#131C28;
    --panel:#1A2532;
    --panel-2:#22303F;
    --panel-3:#2C3D4F;
    --ink:#E6EDF4;
    --ink-2:#B3C2D1;
    --ink-3:#8093A6;
    --edge:#05080C;
    --hairline:#3A4C60;
    --sky:#68A9E0;
    --clay:#E4794A;
    --grass:#5FBF7E;
    --gold:#F0BC46;
    --alarm:#EC5F5A;
    --violet:#A98BD6;
    --st-in:#5FBF7E;
    --st-strug:#F0A93C;
    --st-out:#EC5F5A;
    --st-ghost:#6C7E92;
    --st-star:#A98BD6;
    --focus:#F0BC46;
    --sky-canvas:#0D131C;
    --cloud:#27374A;
    --cloud-2:#1B2836;
  }
}
:root[data-theme="dark"]{
  --ground:#0D131C; --ground-2:#131C28; --panel:#1A2532; --panel-2:#22303F; --panel-3:#2C3D4F;
  --ink:#E6EDF4; --ink-2:#B3C2D1; --ink-3:#8093A6; --edge:#05080C; --hairline:#3A4C60;
  --sky:#68A9E0; --clay:#E4794A; --grass:#5FBF7E; --gold:#F0BC46; --alarm:#EC5F5A; --violet:#A98BD6;
  --st-in:#5FBF7E; --st-strug:#F0A93C; --st-out:#EC5F5A; --st-ghost:#6C7E92; --st-star:#A98BD6;
  --focus:#F0BC46; --sky-canvas:#0D131C; --cloud:#27374A; --cloud-2:#1B2836;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
canvas{display:block}
a{color:var(--clay)}

/* ---------- pixel type ---------- */
.px{font-family:"Press Start 2P","Courier New",monospace;font-weight:400;line-height:1.5;letter-spacing:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shared bits ---------- */
.kaia{
  display:flex;gap:12px;border-left:5px solid var(--violet);background:var(--panel-2);
  padding:12px 14px;margin-bottom:22px;
}
.kaia-who{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--violet);
  flex:none;padding-top:3px;letter-spacing:1px}
.kaia-say{font-size:15px;font-style:italic;color:var(--ink)}
.eyebrow{font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:2px;color:var(--clay)}
.screen-title{font-family:"Press Start 2P",monospace;font-size:clamp(13px,2.6vw,19px);
  line-height:1.45;margin:10px 0 6px}
.hr{height:3px;background:var(--edge);border:0;margin:22px 0;opacity:.85}
.dotrule{height:0;border-top:3px dotted var(--hairline);margin:20px 0}

/* buttons */
.btn{
  font-family:"Press Start 2P",monospace;font-size:11px;line-height:1;cursor:pointer;
  border:4px solid var(--edge);background:var(--gold);color:#141C26;padding:15px 22px;
  box-shadow:var(--shadow-sm);transition:transform .06s steps(2),box-shadow .06s steps(2);
}
.btn:hover{background:var(--clay);color:#FFF6EA}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:none;border-width:3px;font-size:9px;padding:11px 14px}
.btn-ghost:hover{background:var(--ink);color:var(--panel)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border:2px solid currentColor;padding:2px 7px}
.chip canvas{image-rendering:pixelated;width:12px;height:12px}
.c-upper{color:var(--violet)} .c-mid{color:var(--sky)} .c-work{color:var(--clay)} .c-pov{color:var(--alarm)}
.badge{display:inline-flex;align-items:center;gap:7px;font-family:"Press Start 2P",monospace;
  font-size:9px;letter-spacing:.5px;border:3px solid currentColor;padding:6px 9px;line-height:1}
.badge canvas{image-rendering:pixelated;width:14px;height:14px}
.b-in{color:var(--st-in)} .b-strug{color:var(--st-strug)} .b-out{color:var(--st-out)}
.b-ghost{color:var(--st-ghost)} .b-star{color:var(--st-star)}

/* ============ APP SHELL ============ */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
.app{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
@media (min-width:960px){.app{padding:26px 24px 90px}}

.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:"Press Start 2P",monospace;font-size:13px;letter-spacing:1px;
  color:var(--ink);text-shadow:3px 3px 0 var(--clay)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;
  border:2px solid var(--hairline);color:var(--ink-2);padding:4px 9px;text-transform:uppercase;
  background:var(--panel);white-space:nowrap}
.pill b{color:var(--ink)}
.mini{font-family:"Press Start 2P",monospace;font-size:8px;line-height:1;cursor:pointer;
  border:2px solid var(--edge);background:var(--panel);color:var(--ink);padding:8px 10px}
.mini:hover{background:var(--gold);color:#141C26}
.mini[aria-pressed="true"]{background:var(--violet);color:#FFF6EA;border-color:var(--violet)}

/* the game screen frame */
.screen{position:relative;background:var(--panel);border:4px solid var(--edge);
  box-shadow:var(--shadow);overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(to bottom,rgba(20,28,38,.05) 0 2px,transparent 2px 4px);
  mix-blend-mode:multiply}
:root[data-theme="dark"] .screen::after{mix-blend-mode:screen;
  background:repeating-linear-gradient(to bottom,rgba(160,200,240,.045) 0 2px,transparent 2px 4px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .screen::after{mix-blend-mode:screen;
  background:repeating-linear-gradient(to bottom,rgba(160,200,240,.045) 0 2px,transparent 2px 4px)}}
.chrome{display:flex;align-items:center;gap:10px;background:var(--edge);color:#E8EDF4;
  padding:9px 12px;font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:1px;
  position:relative;z-index:4}
.chrome-dot{width:8px;height:8px;background:var(--clay);flex:none}
.chrome-right{margin-left:auto;color:#93A5B8;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:0}
.pad{padding:24px 20px;position:relative;z-index:2}
@media (min-width:760px){.pad{padding:34px 34px}}

/* two-column: dashboard rail + stage */
.layout{display:grid;gap:18px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 292px}}

/* ============ DASHBOARD RAIL ============ */
.dash{background:var(--panel);border:4px solid var(--edge);box-shadow:var(--shadow-sm)}
.dash-head{background:var(--edge);color:#E8EDF4;padding:9px 12px;
  font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:1px}
.dash-body{padding:12px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tally-cell{border:2px solid currentColor;padding:6px 4px;text-align:center}
.tally-n{font-family:"Press Start 2P",monospace;font-size:15px;line-height:1.3}
.tally-l{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;height:12px;border:2px solid var(--edge);margin-bottom:14px;overflow:hidden}
.bar span{display:block;height:100%}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.rrow{display:flex;align-items:center;gap:8px;padding:4px 5px;border:2px solid transparent}
.rrow.is-now{border-color:var(--gold);background:var(--panel-2)}
.rrow canvas{width:20px;height:24px;image-rendering:pixelated;flex:none}
.rrow-name{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow-dot{width:14px;height:14px;flex:none;image-rendering:pixelated}
.rrow.is-out .rrow-name{color:var(--st-ghost);text-decoration:line-through;text-decoration-thickness:2px}
.rrow.is-out canvas{opacity:.45}
.crowd{margin-top:12px;border-top:3px dotted var(--hairline);padding-top:10px}
.crowd-l{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:7px}
.crowd-grid{display:flex;flex-wrap:wrap;gap:2px}
.crowd-grid i{width:8px;height:8px;display:block}

/* ============ CHOICES ============ */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  border:3px solid var(--edge);background:var(--panel-2);color:var(--ink);padding:14px 15px;
  font-family:inherit;font-size:15px;line-height:1.45;
  box-shadow:var(--shadow-sm);transition:transform .06s steps(2),box-shadow .06s steps(2),background .1s}
.choice:hover{background:var(--gold);color:#141C26}
.choice:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
.choice[disabled]{cursor:not-allowed;opacity:.55;box-shadow:none}
.choice-k{font-family:"Press Start 2P",monospace;font-size:13px;flex:none;
  width:30px;height:30px;display:grid;place-items:center;border:3px solid currentColor}
.choice-t{flex:1;min-width:0}
.choice-cost{display:block;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  font-weight:600;letter-spacing:.02em;color:var(--clay)}
.choice:hover .choice-cost{color:#5A2A0E}
.choice-ic{width:20px;height:20px;image-rendering:pixelated;flex:none;margin-top:5px}

/* ============ CHALLENGE ============ */
.chal-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  border:3px solid var(--edge);background:var(--panel-2);padding:14px 16px;margin-bottom:20px}
.clock{font-family:"Press Start 2P",monospace;font-size:clamp(26px,7vw,44px);line-height:1;
  color:var(--st-in);min-width:3.4ch;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--st-strug)}
.clock.crit{color:var(--st-out);animation:blink .5s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.chal-meta{flex:1;min-width:180px}
.chal-diff{display:flex;gap:3px;align-items:center;margin-top:6px}
.chal-diff i{width:11px;height:11px;border:2px solid var(--edge);display:block;background:transparent}
.chal-diff i.on{background:var(--clay)}
.chal-diff span{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;margin-left:6px;color:var(--ink-2)}
.tbar{height:10px;border:2px solid var(--edge);width:100%;margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--st-in);transition:width .95s linear}
.tbar.warn i{background:var(--st-strug)} .tbar.crit i{background:var(--st-out)}
.q{border-left:5px solid var(--sky);background:var(--panel-2);padding:12px 14px;margin-bottom:12px}
.q-n{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--sky);letter-spacing:1px}
.q-t{font-size:15.5px;margin-top:7px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opt{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;cursor:pointer;
  border:3px solid var(--edge);background:var(--panel);color:var(--ink);padding:9px 14px}
.opt:hover{background:var(--sky);color:#FFF}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.field{width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink);
  background:var(--panel);border:3px solid var(--edge);padding:12px 13px;resize:vertical}
.field::placeholder{color:var(--ink-3)}
.hint{font-size:13.5px;color:var(--ink-2);margin-top:9px}

/* ============ RESULTS ============ */
.res{display:flex;gap:14px;border:3px solid var(--edge);background:var(--panel-2);
  padding:14px 15px;margin-bottom:10px;border-left-width:9px}
.res.r-in{border-left-color:var(--st-in)}
.res.r-strug{border-left-color:var(--st-strug)}
.res.r-out{border-left-color:var(--st-out);background:var(--panel-3)}
.res canvas{width:34px;height:40px;image-rendering:pixelated;flex:none}
.res.r-out canvas{opacity:.4}
.res-b{flex:1;min-width:0}
.res-n{font-family:"Press Start 2P",monospace;font-size:11px;letter-spacing:.5px}
.res-say{font-size:14.5px;color:var(--ink-2);margin:7px 0 10px}
.res-say b{color:var(--ink);font-weight:600}
.reveal{opacity:0;transform:translateY(10px);animation:pop .28s steps(4) forwards}
@keyframes pop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

/* ============ VOTING ============ */
.votes{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.votes{grid-template-columns:1fr 1fr}}
.vcard{display:flex;gap:11px;align-items:center;text-align:left;cursor:pointer;
  border:3px solid var(--edge);background:var(--panel-2);color:var(--ink);padding:11px 12px;font-family:inherit}
.vcard:hover{background:var(--gold);color:#141C26}
.vcard[aria-pressed="true"]{background:var(--alarm);color:#FFF3F0;border-color:var(--alarm)}
.vcard canvas{width:26px;height:31px;image-rendering:pixelated;flex:none}
.vcard-n{display:block;font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.4}
.vcard-s{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;margin-top:6px;opacity:.85}
.tallybar{display:flex;align-items:center;gap:10px;margin:7px 0}
.tallybar-n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;width:88px;flex:none}
.tallybar-t{flex:1;height:16px;border:2px solid var(--edge);background:var(--panel-2)}
.tallybar-t i{display:block;height:100%;background:var(--alarm);transition:width .5s steps(8)}
.tallybar-c{font-family:"Press Start 2P",monospace;font-size:10px;width:2ch;text-align:right}
.mimes{border:3px dashed var(--st-ghost);padding:13px 14px;margin-top:20px;background:transparent}
.mimes-h{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--st-ghost);
  letter-spacing:1px;margin-bottom:11px}
.mime-row{display:flex;flex-wrap:wrap;gap:14px}
.mime{display:flex;align-items:center;gap:8px;color:var(--st-ghost);
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-style:italic}
.mime canvas{width:22px;height:26px;image-rendering:pixelated;opacity:.55;animation:sway 1.6s steps(2) infinite}
@keyframes sway{50%{transform:translateX(3px)}}

/* ============ FINAL ROUND ============ */
.bin{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:6px}
.binrow{display:flex;align-items:center;gap:9px;border:3px solid var(--edge);
  background:var(--panel-2);padding:9px 11px;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;font-weight:600}
.binrow canvas{width:16px;height:16px;image-rendering:pixelated;flex:none}
.sketch{border:3px solid var(--edge);background:var(--panel);touch-action:none;cursor:crosshair;
  width:100%;max-width:420px;height:210px;image-rendering:pixelated;display:block}
.eq{display:flex;align-items:flex-end;gap:4px;height:52px}
.eq i{width:9px;background:var(--violet);display:block;animation:eq .7s steps(4) infinite alternate}
.eq i:nth-child(2n){background:var(--sky);animation-duration:.5s}
.eq i:nth-child(3n){background:var(--clay);animation-duration:.9s}
@keyframes eq{from{height:14%}to{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{height:60%}}
.track{position:relative;border:3px solid var(--edge);background:var(--panel-2);
  height:150px;overflow:hidden;margin-top:16px}
.track-line{position:absolute;top:0;bottom:0;width:5px;background:var(--alarm);opacity:.8}
.runner{position:absolute;bottom:12px;transition:left .3s linear;text-align:center}
.runner canvas{width:28px;height:33px;image-rendering:pixelated;animation:hop .34s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-5px)}}
.runner b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  margin-top:2px;white-space:nowrap}

/* ============ DEBRIEF ============ */
.pattern{display:grid;gap:8px;margin:8px 0 4px}
.prow{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center}
.prow-l{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em}
.prow-t{height:20px;border:2px solid var(--edge);background:var(--panel-2);display:flex}
.prow-t i{display:block;height:100%}
.prow-v{font-family:"Press Start 2P",monospace;font-size:10px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.legend i{width:12px;height:12px;border:2px solid var(--edge);display:block}
.cols{display:grid;gap:18px}
@media (min-width:720px){.cols{grid-template-columns:1fr 1fr}}
.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.list li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.list canvas{width:14px;height:14px;image-rendering:pixelated;flex:none;margin-top:4px}
.list .who{font-weight:600}
.list .why{color:var(--ink-2)}
.qs{counter-reset:q;list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.qs li{counter-increment:q;display:flex;gap:12px;font-size:15.5px;line-height:1.5}
.qs li::before{content:counter(q);font-family:"Press Start 2P",monospace;font-size:11px;
  color:var(--clay);flex:none;border:3px solid var(--clay);width:30px;height:30px;
  display:grid;place-items:center}
.note{border-left:5px solid var(--clay);background:var(--panel-2);padding:13px 15px;
  font-size:14px;color:var(--ink-2);margin-top:20px}
.note b{color:var(--ink)}

/* ============ SETUP / CAST ============ */
.setup-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0 6px}
.stepper{display:flex;align-items:center;gap:0;border:3px solid var(--edge);background:var(--panel-2)}
.stepper button{font-family:"Press Start 2P",monospace;font-size:13px;cursor:pointer;border:0;
  background:transparent;color:var(--ink);padding:12px 16px;line-height:1}
.stepper button:hover{background:var(--gold);color:#141C26}
.stepper output{font-family:"Press Start 2P",monospace;font-size:19px;padding:0 18px;min-width:4.4ch;
  text-align:center;font-variant-numeric:tabular-nums}
.cast{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(228px,1fr))}
.ccard{border:3px solid var(--edge);background:var(--panel-2);padding:13px;box-shadow:var(--shadow-sm)}
.ccard-h{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.ccard-h canvas{width:32px;height:38px;image-rendering:pixelated;flex:none}
.ccard-n{font-family:"Press Start 2P",monospace;font-size:11px}

.meter{display:flex;gap:3px;align-items:center;margin-top:11px}
.meter i{width:13px;height:9px;border:2px solid var(--edge);display:block}

.meter span{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;

.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.actions .spacer{flex:1}

/* index overlay */
.idx{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.86);
  display:grid;place-items:center;padding:20px;overflow:auto}
.idx-panel{background:var(--panel);border:4px solid var(--edge);box-shadow:10px 10px 0 rgba(0,0,0,.4);

.idx-b em{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--clay);font-style:normal}
.idx-b:hover em{color:#5A2A0E}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* MR. SYSTEM interruption */
.mrsys{display:flex;gap:12px;border:3px solid var(--alarm);border-left-width:9px;
  background:var(--panel-3);padding:14px 15px;margin:18px 0 14px}
.mrsys-who{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--alarm);
  flex:none;padding-top:3px;letter-spacing:1px;animation:blink 1.1s steps(2,end) infinite}
.mrsys-say{font-size:15.5px;color:var(--ink);font-weight:500}

/* Mr. System's memo (vote screen) */
.memo{border:3px solid var(--edge);background:var(--panel-2);margin-bottom:20px}

.memo-intro{padding:11px 14px 4px;font-size:13px;font-style:italic;color:var(--ink-2)}
.memo-list{list-style:none;margin:0;padding:8px 14px 13px;display:flex;flex-direction:column;gap:9px}
.memo-item{font-size:14px;line-height:1.5}
.memo-item b{font-family:"Press Start 2P",monospace;font-size:9px;letter-spacing:.5px}
.memo-pol{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.memo-item.is-withdrawn{color:var(--st-star)}
.memo-item.is-withdrawn .memo-struck{text-decoration:line-through;text-decoration-thickness:2px}
.memo-item.is-withdrawn em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  font-weight:600;letter-spacing:.04em}
.vcard-flag{margin-left:auto;flex:none;font-size:13px}

/* roster mode picker */
.modes{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:14px 0 4px}
.mode{text-align:left;cursor:pointer;border:3px solid var(--edge);background:var(--panel-2);
  color:var(--ink);padding:12px 13px;font-family:inherit}
.mode:hover{background:var(--gold);color:#141C26}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mode b{display:block;font-family:"Press Start 2P",monospace;font-size:10px;margin-bottom:7px}
.mode span{display:block;font-size:12.5px;line-height:1.45;opacity:.9}
.roster-picks{display:grid;gap:5px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border:3px dashed var(--hairline);padding:12px;margin-top:12px}
.rpick{display:flex;gap:7px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;
  font-weight:600;cursor:pointer;border:2px solid transparent;padding:3px 5px}
.rpick:hover{border-color:var(--edge)}
.rpick input{accent-color:var(--clay)}
.deal{border-left:5px solid var(--sky);background:var(--panel-2);padding:12px 14px;margin-top:16px;
  font-size:14px;color:var(--ink-2)}

/* ============ PROFESSOR EDITOR ============ */
.ed-open{position:fixed;inset:0;z-index:70;background:rgba(10,16,24,.82);display:flex;justify-content:flex-end}
.ed{background:var(--panel);border-left:4px solid var(--edge);width:min(660px,100%);height:100%;
  display:flex;flex-direction:column;box-shadow:-10px 0 0 rgba(0,0,0,.25)}
.ed-head{background:var(--edge);color:#E8EDF4;padding:12px 16px;display:flex;align-items:center;gap:12px;

.ed-head button{margin-left:auto;font-family:"Press Start 2P",monospace;font-size:9px;cursor:pointer;
  border:2px solid #E8EDF4;background:transparent;color:#E8EDF4;padding:7px 10px}
.ed-head button:hover{background:#E8EDF4;color:var(--edge)}
.ed-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:10px 12px 0;background:var(--panel-2);
  border-bottom:3px solid var(--edge);flex:none}
.ed-tab{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer;border:2px solid var(--edge);border-bottom:0;
  background:transparent;color:var(--ink-2);padding:8px 11px}
.ed-tab:hover{background:var(--gold);color:#141C26}
.ed-tab[aria-selected="true"]{background:var(--panel);color:var(--ink);position:relative;top:3px}
.ed-body{flex:1;overflow-y:auto;padding:20px 18px 30px}
.ed-foot{flex:none;border-top:3px solid var(--edge);background:var(--panel-2);padding:12px 16px;

.ed-h{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--clay);letter-spacing:1px;
  margin:22px 0 12px;padding-bottom:8px;border-bottom:3px dotted var(--hairline)}
.ed-h:first-child{margin-top:0}
.ed-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-3);margin:16px 0 8px}
.ef{display:block;margin-bottom:13px}
.ef>span{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-bottom:5px}
.ef>em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.ef input,.ef textarea,.ef select{width:100%;font-family:"IBM Plex Sans",sans-serif;font-size:14.5px;
  color:var(--ink);background:var(--panel);border:2px solid var(--edge);padding:8px 9px}

.ed-card{border:3px solid var(--edge);background:var(--panel-2);padding:13px;margin-bottom:14px}

.ed-card-h b{font-family:"Press Start 2P",monospace;font-size:10px}
.ed-mini{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;cursor:pointer;border:2px solid var(--edge);background:var(--panel);

.ed-json{width:100%;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.5;
  color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);padding:10px;resize:vertical}
.ed-warn{border-left:5px solid var(--clay);background:var(--panel-2);padding:12px 14px;font-size:13.5px;
  color:var(--ink-2);margin-bottom:16px}
.ed-warn b{color:var(--ink)}
.mini.is-live{background:var(--violet);color:#FFF6EA;border-color:var(--violet)}

/* ============ PRINT PACK ============ */
#printroot{display:none}
body.printing .app,body.printing #sky,body.printing #edroot,body.printing #overlay{display:none}
body.printing{background:#8a8a8a}
body.printing #printroot{display:block}
.pp-bar{position:sticky;top:0;z-index:80;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:#141C26;color:#E8EDF4;padding:10px 16px;font-family:"IBM Plex Sans",sans-serif}
.pp-bar b{font-family:"Press Start 2P",monospace;font-size:9px;letter-spacing:1px}
.pp-bar select{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 8px;
  background:#F4E9D2;color:#141C26;border:2px solid #05080C}
.pp-btn{font-family:"Press Start 2P",monospace;font-size:9px;cursor:pointer;
  border:2px solid #E8EDF4;background:transparent;color:#E8EDF4;padding:8px 11px}
.pp-btn:hover{background:#E8EDF4;color:#141C26}
.pp-note{font-size:12px;opacity:.75}

/* sheets: dark-on-light always, theme-independent */
.sheet{width:7.7in;min-height:9.9in;margin:18px auto;background:#fff;color:#111;
  padding:.45in;box-shadow:0 3px 18px rgba(0,0,0,.4);box-sizing:border-box;
  font-family:"IBM Plex Sans",sans-serif;font-size:10.5pt;line-height:1.45;position:relative}
.sheet h2{font-family:"Press Start 2P",monospace;font-size:13pt;margin:0 0 10px;color:#111}
.sheet h3{font-family:"Press Start 2P",monospace;font-size:9pt;margin:16px 0 8px;color:#111;
  border-bottom:2px solid #111;padding-bottom:5px}
.pp-eyebrow{font-family:"Press Start 2P",monospace;font-size:6.5pt;letter-spacing:2px;color:#555;margin:0 0 8px}
.pp-foot{position:absolute;bottom:.28in;left:.45in;right:.45in;display:flex;justify-content:space-between;
  font-family:"IBM Plex Mono",monospace;font-size:7.5pt;color:#777}

/* card grids */
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pcard{border:1.5px dotted #999;padding:.16in;box-sizing:border-box;display:flex;flex-direction:column;
  overflow:hidden;position:relative;background:#fff}
.pcard-role{height:4.35in}
.pcard-round{height:4.35in}
.pcard-chal{height:4.35in}
.pcard-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pcard-name{font-family:"Press Start 2P",monospace;font-size:10pt}
.pcard-chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:7.5pt;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;border:1.5px solid #111;padding:1px 6px;margin-top:4px}
.pcard-who{font-size:9pt;color:#333;margin:2px 0 6px}
.pcard-tags{list-style:none;margin:0;padding:0;font-size:8.5pt;color:#333}
.pcard-tags li{padding-left:11px;position:relative;margin-bottom:2px}
.pcard-tags li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;background:#111}
.pcard-load{font-family:"IBM Plex Mono",monospace;font-size:9pt;letter-spacing:2px;margin-top:auto;padding-top:6px}
.pcard-footer{border-top:1.5px solid #111;margin-top:6px;padding-top:5px;font-size:7.5pt;
  font-style:italic;color:#444}
.ptab{position:absolute;top:0;right:0;background:#111;color:#fff;
  font-family:"Press Start 2P",monospace;font-size:8pt;padding:5px 8px}
.pcard-sit{font-size:9.5pt;margin:4px 0 8px;line-height:1.4}
.pchoice{display:flex;gap:8px;margin-bottom:6px;font-size:9pt;line-height:1.35}
.pchoice b{font-family:"Press Start 2P",monospace;font-size:8pt;flex:none;border:1.5px solid #111;
  width:.22in;height:.22in;display:flex;align-items:center;justify-content:center}
.pchoice .pcost{display:block;font-family:"IBM Plex Mono",monospace;font-size:7.5pt;color:#555;margin-top:1px}
.pchoice .pchal-mark{display:block;font-size:7.5pt;font-weight:600;margin-top:1px}
.ptimer{font-family:"Press Start 2P",monospace;font-size:26pt;text-align:center;margin:8px 0;
  border:3px solid #111;padding:8px}
.pneed{font-family:"IBM Plex Mono",monospace;font-size:9pt;font-weight:600;text-align:center;margin-bottom:8px}
.pq{border-left:3px solid #111;padding-left:8px;margin-bottom:7px;font-size:8.5pt}
.pq b{display:block}
.pq span{color:#333}

/* script book */
.script-fam{border:1.5px solid #111;padding:8px 10px;margin-bottom:10px}
.script-fam h4{font-family:"Press Start 2P",monospace;font-size:8pt;margin:0 0 6px}
.script-line{display:flex;gap:8px;font-size:9pt;margin-bottom:5px;line-height:1.4}
.script-line b{font-family:"Press Start 2P",monospace;font-size:7.5pt;flex:none;padding-top:1px}
.script-st{font-family:"IBM Plex Mono",monospace;font-size:7.5pt;font-weight:700;white-space:nowrap}
.pkaia{border-left:4px solid #111;background:#f0f0f0;padding:8px 12px;font-style:italic;
  font-size:10pt;margin:0 0 12px}
.pdice{border:1.5px dashed #111;background:#f7f7f7;padding:6px 9px;margin:4px 0;
  font-size:8.5pt;font-weight:600}
.pmrsys{border:3px solid #111;padding:7px 10px;margin:4px 0 8px;font-size:9pt}
.pmrsys b{font-family:"Press Start 2P",monospace;font-size:7pt;display:block;margin-bottom:4px}
.pmrsys .pfn{font-size:7.5pt;color:#444;border-top:1px solid #999;margin-top:5px;padding-top:4px;font-weight:400}
.pnote{border:1.5px solid #111;background:#f0f0f0;padding:7px 10px;font-size:8.5pt;margin:8px 0}
.pcheck{list-style:none;margin:6px 0;padding:0;font-size:9.5pt}
.pcheck li{padding-left:18px;position:relative;margin-bottom:4px}
.pcheck li::before{content:"\2610";position:absolute;left:0}

/* memo sheets */
.pmemo-line{display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted #999;
  padding:7px 0;font-size:9.5pt}
.pmemo-line .blank{border-bottom:1.5px solid #111;min-width:1.4in;display:inline-block}
.pmemo-line .pol{font-family:"IBM Plex Mono",monospace;font-size:8pt;color:#555;white-space:nowrap}
.pmemo-line.withdrawn{text-decoration:line-through}
.pmemo-line.withdrawn .excuse{text-decoration:none;font-family:"IBM Plex Mono",monospace;
  font-size:8pt;font-weight:600}

/* table pieces */
.pboard{width:100%;border-collapse:collapse;font-size:8.5pt}
.pboard th,.pboard td{border:1.5px solid #111;padding:5px 6px;text-align:left}
.pboard th{font-family:"Press Start 2P",monospace;font-size:6.5pt}
.pboard td.pb-name{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:8.5pt}
.ptent{height:3.2in;border:1.5px dotted #999;position:relative;display:flex;flex-direction:column}
.ptent-half{height:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:"Press Start 2P",monospace;font-size:9pt;text-align:center;padding:0 .2in}
.ptent-half small{font-family:"IBM Plex Sans",sans-serif;font-size:8.5pt;text-transform:none}
.ptent-half.flip{transform:rotate(180deg);border-bottom:1px dashed #999}
.pstar{border:4px double #111;padding:.18in;height:2.6in;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:8px}
.pstar-name{font-family:"Press Start 2P",monospace;font-size:10pt}
.pstar-line{font-size:9.5pt;font-style:italic}
.pslip{border:1.5px dotted #999;padding:.12in;font-family:"IBM Plex Mono",monospace;font-size:8.5pt;
  height:1.5in;display:flex;flex-direction:column;justify-content:center;gap:8px}
.pslip .blank{border-bottom:1.5px solid #111;display:inline-block;min-width:1.2in}
.prun{width:100%;border-collapse:collapse;font-size:9.5pt}
.prun th,.prun td{border:1.5px solid #111;padding:6px 8px;text-align:left;vertical-align:top}
.prun th{font-family:"Press Start 2P",monospace;font-size:6.5pt}
.ptoc{list-style:none;margin:14px 0;padding:0;font-size:11pt}
.ptoc li{display:flex;gap:8px;margin-bottom:7px}
.ptoc b{font-family:"Press Start 2P",monospace;font-size:8pt}

@media print{
  body,body.printing{background:#fff !important}
  .pp-bar{display:none !important}
  .sheet{width:auto;min-height:0;margin:0;box-shadow:none;page-break-after:always}
  .pcard,.script-fam,.pmemo-line,.pmrsys,.pdice,.pstar,.ptent,.pslip{break-inside:avoid;page-break-inside:avoid}
}
#printroot[data-show]:not([data-show="all"]) .sheet{display:none}
#printroot[data-show="roles"] .sheet[data-sec="roles"],
#printroot[data-show="rounds"] .sheet[data-sec="rounds"],
#printroot[data-show="challenges"] .sheet[data-sec="challenges"],
#printroot[data-show="script"] .sheet[data-sec="script"],

#printroot[data-show="table"] .sheet[data-sec="table"],
#printroot[data-show="run"] .sheet[data-sec="run"],
#printroot[data-show="cover"] .sheet[data-sec="cover"]{display:block}
</style>

<script>
(() => {
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ==========================================================
   1. PIXEL SPRITE ENGINE
   12x14 character sprites + 8x8 icons, drawn to canvas.
   ========================================================== */
const BASE = [
"....HHHH....","...HHHHHH...","..HHHHHHHH..","..HSSSSSSH..","..HSESSESH..",
"..HSSSSSSH..","...SSSSSS...","....SSSS....","..TTTTTTTT..",".STTTTTTTTS.",
".STTTTTTTTS.","..TTTTTTTT..","..PPP..PPP..","..BBB..BBB.."];
const TEMPLATES = {
  base: BASE,
  wheel: BASE.slice(0,12).concat([".WWPPPPPPWW.",".WW.WWWW.WW."]),
  wrap: ["....AAAA....","...AAAAAA...","..AAAAAAAA..","..ASSSSSSA..","..ASESSESA..",
         "..ASSSSSSA..","..ASSSSSSA..","..AASSSSAA.."].concat(BASE.slice(8)),
  cap: ["...AAAAAA...","..AAAAAAAA..",".AAAAAAAAAA."].concat(BASE.slice(3)),
  long: ["....HHHH....","...HHHHHH...","..HHHHHHHH..","..HSSSSSSH..","..HSESSESH..",
         "..HSSSSSSH..","..HSSSSSSH..","..HHSSSSHH..","..TTTTTTTT..",".STTTTTTTTS.",
         ".STTTTTTTTS.","..TTTTTTTT..","..PPP..PPP..","..BBB..BBB.."]
};
const GHOST_PAL = {H:"#7E8B9B",S:"#96A3B2",E:"#5A6675",T:"#8894A3",P:"#78848F",
                   B:"#6C7883",A:"#8894A3",W:"#78848F",L:"#AAB6C2"};

function drawSprite(cv, ch, opts){
  opts = opts || {};
  const rows = TEMPLATES[ch.tmpl] || BASE;
  const pal = opts.ghost ? GHOST_PAL : Object.assign({E:"#141C26"}, ch.pal);
  const w = 12, h = 14, px = opts.px || 3, pad = opts.outline ? 1 : 0;
  cv.width = (w + pad*2)*px; cv.height = (h + pad*2)*px;
  const g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.clearRect(0,0,cv.width,cv.height);
  const cells = [];
  for (let y=0; y<h; y++){
    const row = rows[y] || "";
    for (let x=0; x<w; x++){
      let c = row[x];
      if (!c || c === ".") continue;
      if (ch.glasses && y===4 && (x===3||x===8)) c = "L";
      if (ch.glasses && y===4 && (x===4||x===7)) c = "E";
      const col = pal[c] || pal.T;
      if (!col) continue;
      cells.push([x,y,col]);
    }
  }
  if (opts.outline){
    g.fillStyle = "#000";
    cells.forEach(([x,y]) => {
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) =>
        g.fillRect((x+dx+pad)*px, (y+dy+pad)*px, px, px));
    });
  }

function icon(name, px, color, accent){
  const rows = ICONS[name] || ICONS.warn, p = px||2;
  const cv = document.createElement("canvas");
  cv.width = 8*p; cv.height = 8*p; cv.setAttribute("aria-hidden","true");
  const g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
  for (let y=0;y<8;y++) for (let x=0;x<8;x++){

 daniel:{sit:"Dad can drive you. Uncle Davoud's van passes the school anyway, full of cousins. Grandma has already called twice, offering to walk you. The only question this morning is who gets to.", choices:[

 kavi:{sit:"Breakfast at 7. Your mother uses the old name twice before the toast is done. The pin with your pronouns is in your jacket pocket, where it lives until the bus stop.", choices:[

 amina:{sit:"Grandma rides the bus with you since the comments started. This morning her hip is bad and she is moving slowly. The bus comes in ten minutes. The next one is half an hour later.", choices:[

 alejandra:{sit:"The driver leaves at 7:15. Your mother wants last night's AP chem lab reviewed in the car. Your hands are shaking.", choices:[

 rajesh:{sit:"Home at 4:30, both of you. She has a worksheet she can't start. You have three assignments you haven't. Your mom is home at seven, on her feet since six.", choices:[

 ling:{sit:"You let yourself in at 4:30. Eight envelopes on the counter, all in English. Your mom is at the restaurant until 11 and two assignments are due tomorrow. You start the rice first.", choices:[

 jamal:{sit:"Asr falls at 4:15, right in the middle of math tutoring. The school has no prayer space; it has never needed one before. Tutoring is what's keeping your grade above a C.", choices:[

 aisha:{sit:"PE, fourth period. The uniform comes in five sizes and stops two before yours. The weigh-in happens by the open gym door. The comments cover your body, your scarf, and your skin, sometimes in the same sentence.", choices:[

 kavi:{sit:"Four people on your father's team were laid off Friday. The new rule arrives by group text: straight home, grades only, no clubs. The QSA meets today at 3:30. It is the one hour a week you spend under one name.", choices:[
  A("A","Go straight home","Your one hour.","home",

  A("B","Go, and call it a study group","A second story to keep up.","book",

 amina:{sit:"Home at 4. Grandma's hip is worse and the clinic line closes at five. Somebody has to make the call in English, and there is one person in the house who can. Homework is due tomorrow.", choices:[

  A("B","Translate the call","Homework.","heart",

     pass:{st:"strug",say:"You hold for nineteen minutes and carry every question across in both directions. Thursday at two, bring her card. The homework does not happen."},
     fail:{st:"strug",say:"One word goes wrong between the two languages and the nurse books her into a clinic that doesn't take her coverage. Tomorrow you make the whole call again, and the homework doesn't happen either way."}}),
  A("C","Both at once","Half of each.","warn",
    {auto:{st:"strug",say:"You do the call with the worksheet on your knee. The nurse asks you to repeat yourself; so does problem four. Everything tonight gets half of you."}})]},
 david:{sit:"Debate club, a chapter of history, and a friend waiting on FaceTime. You have four hours before sleep.", choices:[
  A("A","Skip debate club","One club meeting.","clock",
    {auto:{st:"in",say:"Homework by nine, FaceTime until eleven, eight hours of sleep."}}),
  A("B","Do the homework late and lose an hour of sleep","One hour.","book",
    {auto:{st:"in",say:"You're tired in first period tomorrow. That is the worst of it."}}),
  A("C","Your parents hired a tutor. Do all three.","Nothing.","star",

 alejandra:{sit:"It is a bad pain day, and it arrived on schedule. The doctors called it endometriosis inside a year and opened a file. There is a diagnosis, a plan, and a specialist whose cell number your mother keeps.", choices:[

     fail:{st:"in",say:"At lunch you fumble the words and it does not matter in the slightest. The nurse has your file open before you finish; the driver is rerouted by two; the specialist sees you at 3:40 anyway."}}),
  A("B","Give up on the day entirely","A day of margin you don't have.","home",

  A("C","Tell someone","The appointment your mother will mention in front of guests.","note",

 priya:{sit:"Tutor at six, your own homework after, and a school voicemail nobody but you can understand.", choices:[

 carlos:{sit:"The shop needs closing at seven. Your homework is untouched. Your dad is asleep before you get home.", choices:[

 chase:{sit:"70 minutes home. There is no internet past the county line, and the assignment is online.", choices:[

 isabella:{sit:"It is a bad pain day and it is only getting worse. The doctors called it weight-related and closed the file. There is no diagnosis, and no healthcare you can reach.", choices:[

 marcus:{sit:"Pick the youngest up from the elementary school across town. Walk all four of you home by five. Cook. Homework. Bedtime.", choices:[

 lucia:{sit:"You have been in the apartment all day. Your mom still is not back. The 10-year-old keeps asking when she is coming home and the 6-year-old has stopped asking, which is worse.", choices:[

 sophia:{sit:"Nine days becomes ten. Your brother is asking questions. Rent was due on the first.", choices:[

 ayesha:{sit:"Past ten. Your mom is at the dining table with one folder and the phone. Through your door you hear her half of it: an attendance hearing, the word \u201cplacement,\u201d and once, \u201cthe one with the three little ones and the bus fares.\u201d", choices:[

  A("B","Pretend not to hear","Nothing.","ghost",

 grace:{sit:"9 PM. The field trip form on the counter says a parent or guardian must sign it by first period. Your mother is twelve hours into a shift; your father's phone is going straight to voicemail. The card can't sign.", choices:[

 tyler:{sit:"It starts at 9:40 the way it starts: a cabinet door, then his voice, then your mother's, lower. Your sister is eight and her room shares a wall with the kitchen. Yours doesn't.", choices:[
  A("A","Take the couch and the headphones","Hearing it anyway.","ghost",

 mei:{sit:"The B+ posts at 9:01. Nobody knocks. By 9:40 there is a confirmation email for a second tutor, Saturdays at 8 AM, and no one has said the grade out loud.", choices:[

  A("B","Ask her to hold it until Saturday","She won't sleep either.","clock",

  A("B","Give her the short version, get back to work","Her side of the story.","book",

 aisha:{sit:"Mom's shift runs to close again. At the bus stop a man leans in and says something about your scarf with the word \u201cshould\u201d in it. You get home at 9:40 with your key between your fingers.", choices:[
  A("A","Tell her when she gets in","Her sleep, on top of yours.","heart",

  A("B","Settle everyone and stay quiet","Sleep, for the whole house.","home",

  A("C","Text a teacher you trust","Saying it in writing.","note",

/* ==========================================================
   4.7 PRINT PACK
   Generates the physical notecard game from live data.
   Pure over globals resolved at call time; used by both builds.
   ========================================================== */
const pesc = x => String(x == null ? "" : x).replace(/[&<>"]/g,
  m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function hydratePrint(el){
  el.querySelectorAll("[data-psprite]").forEach(n => {
    if (n.firstChild) return;
    const ch = BY_ID[n.dataset.psprite]; if (!ch) return;
    const cv = document.createElement("canvas");
    drawSprite(cv, ch, {px: +(n.dataset.px || 6), outline: true});
    cv.style.width = (cv.width / 3) + "px";
    cv.style.imageRendering = "pixelated";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", "Pixel portrait of " + ch.name);
    n.appendChild(cv);
  });
}
const PP_STATUS = {in: "IN SCHOOL", strug: "STRUGGLING", out: "OUT"};
function ppLoad(load){
  let out = "";
  for (let i = 1; i <= 5; i++) out += i <= load ? "\u25a0" : "\u25a1";
  return out + "  LOAD " + load + "/5";
}
function ppDiceFaces(pr){ return Math.max(1, Math.min(5, Math.round((pr || 0) * 6))); }
function ppSheet(sec, title, eyebrow, body, foot){
  return `<section class="sheet" data-sec="${sec}">
    <p class="pp-eyebrow">${pesc(eyebrow)}</p>
    ${title ? `<h2>${pesc(title)}</h2>` : ""}
    ${body}
    <div class="pp-foot"><span>MR. SYSTEM \u2014 PRINT PACK</span><span>${pesc(foot || "")}</span></div>
  </section>`;
}
function chunk(arr, n){
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

function buildPrintPack(opts){
  const active = CAST.filter(c => opts.activeIds.indexOf(c.id) >= 0);
  const groups = Math.ceil(opts.classSize / 5);
  const per = Math.ceil(active.length / groups);
  const modeLabel = SETTINGS.rosterMode.toUpperCase() + " \u00b7 " + active.length + " families";
  const sheets = [];

  /* ---- cover + TOC ---- */
  sheets.push(ppSheet("cover", "MR. SYSTEM", "THE PHYSICAL GAME \u2014 PRINT PACK", `
    <p style="font-size:11pt;max-width:5.6in">Everything the room needs to play by hand. Print this pack,
      bring a die, painter's tape, a bin, pens, and a timer \u2014 the game is the notecards; the site is
      only the demo.</p>
    <div class="pnote"><b>This pack was generated from:</b> ${pesc(opts.customized
      ? "a CUSTOMIZED content pack (PROF EDIT changes included)" : "the default content pack")}
      \u00b7 roster ${pesc(modeLabel)} \u00b7 class size ${opts.classSize} \u00b7 danger mode
      ${pesc(SETTINGS.dangerMode.toUpperCase())} \u00b7 ${pesc(opts.dateStr)}</div>
    <h3>CONTENTS</h3>
    <ul class="ptoc">
      <li><b>1</b> Role cards \u2014 one per family, dealt once, kept all game (cardstock)</li>
      <li><b>2</b> Round cards \u2014 the dilemmas, drawn each round (cardstock)</li>
      <li><b>3</b> Challenge cards (cardstock)</li>
      <li><b>4</b> Kaia's script book \u2014 the narrator's binder (paper)</li>
      <li><b>5</b> Mr. System's memo sheets \u2014 one per vote (paper)</li>
      <li><b>6</b> Table pieces \u2014 status board, ghost tents, star cards, vote slips</li>
      <li><b>7</b> Run of show \u2014 one page for the podium</li>
    </ul>
    <div class="pnote">${pesc(TEXT.titleWarn || "")}</div>`,
    "cover"));

  /* ---- 1. role cards ---- */
  const roleCard = ch => `<div class="pcard pcard-role">
    <div class="pcard-h"><span data-psprite="${ch.id}" data-px="6"></span>
      <div><div class="pcard-name">${pesc(ch.name)}</div>
        <span class="pcard-chip">${pesc(ch.cls)}</span></div></div>
    <p class="pcard-who">${pesc(ch.who)}</p>
    <ul class="pcard-tags">${ch.tags.map(t => `<li>${pesc(t)}</li>`).join("")}</ul>
    <div class="pcard-load">${ppLoad(ch.load)}</div>
    <div class="pcard-footer">You are this family for the whole game. You choose. Mr. System decides
      what it costs.</div>
  </div>`;
  chunk(active, 4).forEach((four, i) => {
    sheets.push(ppSheet("roles", i === 0 ? "ROLE CARDS" : "", "SECTION 1 \u2014 ROLE CARDS \u00b7 CUT ALONG DOTTED LINES",
      `<div class="pgrid2">${four.map(roleCard).join("")}</div>`, "roles \u00b7 p" + (i + 1)));
  });
  const povActive = active.filter(c => c.tier === "pov");
  if (povActive.length)
    chunk(povActive, 4).forEach((four, i) => {
      sheets.push(ppSheet("roles", "", "SECTION 1 \u2014 SPARE COPIES \u00b7 POVERTY/CRISIS BLOCK (CARDS GET LOST; THESE CANNOT BE MISSING)",
        `<div class="pgrid2">${four.map(roleCard).join("")}</div>`, "roles \u00b7 spares p" + (i + 1)));
    });

  /* ---- 2. round cards (NO OUTCOMES, NO DANGER TELLS) ---- */
  const roundCard = (ch, d, r) => `<div class="pcard pcard-round">
    <span class="ptab">R${r}</span>
    <div class="pcard-name" style="font-size:9pt;margin-bottom:2px">${pesc(ch.name)}</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:7pt;color:#555;margin-bottom:5px">${pesc(ROUND_NAME[r])}</div>
    <p class="pcard-sit">${pesc(d.sit)}</p>
    ${d.note ? `<p style="font-size:8pt;font-weight:700;margin:0 0 6px">${pesc(d.note)}</p>` : ""}
    ${d.choices.map(c => `<div class="pchoice"><b>${pesc(c.k)}</b>
      <span>${pesc(c.t)}<span class="pcost">COST: ${pesc(c.cost)}</span>
      ${c.chal ? `<span class="pchal-mark">\u26a1 This choice triggers a challenge card.</span>` : ""}</span>
    </div>`).join("")}
    <div class="pcard-footer" style="margin-top:auto">Argue it. Commit to a letter out loud. Kaia has the rest.</div>
  </div>`;
  [1, 2, 3].forEach(r => {
    const cards = active.filter(ch => DILEMMAS[r] && DILEMMAS[r][ch.id])
      .map(ch => roundCard(ch, DILEMMAS[r][ch.id], r));
    chunk(cards, 2).forEach((two, i) => {
      sheets.push(ppSheet("rounds", i === 0 ? "ROUND " + r + " CARDS" : "",
        "SECTION 2 \u2014 ROUND CARDS \u00b7 " + pesc(ROUND_NAME[r]),
        `<div class="pgrid2">${two.join("")}</div>`, "round " + r + " \u00b7 p" + (i + 1)));
    });
  });

  /* ---- 3. challenge cards ---- */
  const usedChals = new Set();
  [1,2,3].forEach(r => active.forEach(ch => {
    const d = DILEMMAS[r] && DILEMMAS[r][ch.id];
    if (d) d.choices.forEach(c => { if (c.chal && CHALLENGES[c.chal]) usedChals.add(c.chal); });
  }));
  const chalCard = key => {
    const c = CHALLENGES[key];
    const need = c.kind === "quiz" ? `Need ${Math.min(c.need, c.qs.length)} of ${c.qs.length}`
      : c.kind === "list" ? `Name any ${c.need}`
      : `Handle ${Math.min(c.need, c.qs.length)} of ${c.qs.length}`;
    let body = "";
    if (c.kind === "quiz")
      body = c.qs.map((q, i) => `<div class="pq"><b>Q${i + 1}. ${pesc(q.q)}</b>
        <span>${q.opts.map(o => pesc(o)).join(" \u00b7 ")}</span></div>`).join("");
    else if (c.kind === "list")
      body = `<div class="pq"><b>${pesc(c.brief)}</b><span>Answers are judged from Kaia's key.</span></div>`;
    else
      body = `<div class="pq"><b>Rapid fire.</b><span>Kaia fires the prompts; answer instantly;
        there is no right answer, only a cheaper one.</span></div>`;
    return `<div class="pcard pcard-chal">
      <div class="pcard-name" style="font-size:9pt">${pesc(c.title)}</div>
      ${c.kind !== "list" ? `<p class="pcard-who">${pesc(c.brief)}</p>` : ""}
      <div class="ptimer">${c.secs}s</div>
      <div class="pneed">${pesc(need)}</div>
      ${body}
      <div class="pcard-footer" style="margin-top:auto">Kaia runs the timer. When it ends, it ends.</div>
    </div>`;
  };
  chunk([...usedChals], 2).forEach((two, i) => {
    sheets.push(ppSheet("challenges", i === 0 ? "CHALLENGE CARDS" : "",
      "SECTION 3 \u2014 CHALLENGE CARDS \u00b7 ANSWER KEYS LIVE IN KAIA'S SCRIPT",
      `<div class="pgrid2">${two.map(chalCard).join("")}</div>`, "challenges \u00b7 p" + (i + 1)));
  });

  /* ---- 4. Kaia's script book ---- */
  sheets.push(ppSheet("script", "KAIA'S SCRIPT BOOK", "SECTION 4 \u2014 THE NARRATOR'S BINDER", `
    <h3>SETUP</h3>
    <p style="font-size:10pt">${groups} groups \u00d7 ${opts.classSize} students \u2014 each group is dealt
      ${per > 1 ? "1\u2013" + per : "one"} role card${per > 1 ? "s" : ""} and <b>is</b> that family.
      One vote per family, cast by a spokesperson. ${active.length} families in play
      (${pesc(modeLabel)}).</p>
    <h3>MATERIALS</h3>
    <ul class="pcheck">
      <li>This pack, cut and sorted \u00b7 painter's tape for the red lines \u00b7 a bin for homework</li>
      <li>Blank paper and pens \u00b7 a speaker \u00b7 a visible timer \u00b7 <b>one d6</b></li>

    <h3>SAFETY \u2014 BEFORE THE FIRST ROUND</h3>
    <div class="pnote">Write on the board and leave up all session:<br>
      <b>Counselor: ______________________ \u00b7 988 Suicide &amp; Crisis Lifeline</b><br><br>

  [1, 2, 3].forEach(r => {
    const fams = active.filter(ch => DILEMMAS[r] && DILEMMAS[r][ch.id]);
    const famBlocks = fams.map(ch => {
      const d = DILEMMAS[r][ch.id];
      const lines = d.choices.map(c => {
        let core;
        if (c.chal && CHALLENGES[c.chal]){
          const def = CHALLENGES[c.chal];
          let key = "";
          if (def.kind === "quiz")

          else if (def.kind === "list")
            key = ` <span class="script-st">[ACCEPT: ${pesc((def.keys || []).slice(0, 10).join(", "))}\u2026]</span>`;
          else
            key = ` <span class="script-st">[PROMPTS: ${def.qs.map(q => pesc(q.q)).join(" \u2022 ")}]</span>`;
          core = `\u26a1 <i>${pesc(def.title)}</i>${key}<br>
            PASS \u2192 ${pesc(c.pass.say)} <span class="script-st">(\u2192 ${PP_STATUS[c.pass.st]})</span><br>
            FAIL \u2192 ${pesc(c.fail.say)} <span class="script-st">(\u2192 ${PP_STATUS[c.fail.st]})</span>`;
        } else {
          core = `${pesc(c.auto.say)} <span class="script-st">(\u2192 ${PP_STATUS[c.auto.st]})</span>`;
        }
        let danger = "";
        if (c.danger && c.danger.standard){
          const faces = ppDiceFaces(c.danger.p);
          danger = `<div class="pdice">\u1f3b2 If they chose ${pesc(c.k)}: roll a d6.
              ${faces === 1 ? "On a 1" : "1\u2013" + faces} \u2192 read the MR. SYSTEM box.

                (\u2192 ${PP_STATUS[c.danger.unsparing.st]})</div>` : ""}</div>`;
        }
        return `<div class="script-line"><b>${pesc(c.k)}</b><span>${core}</span></div>${danger}`;
      }).join("");
      return `<div class="script-fam"><h4>${pesc(ch.name)}</h4>${lines}</div>`;
    });
    chunk(famBlocks, 3).forEach((three, i) => {
      sheets.push(ppSheet("script", i === 0 ? "SCRIPT \u2014 ROUND " + r : "",
        "SECTION 4 \u2014 " + pesc(ROUND_NAME[r]),
        (i === 0 ? `<div class="pkaia">${pesc(ROUND_KAIA[r])}</div>` : "") + three.join(""),

      <div class="pkaia">${pesc(TEXT.voteKaia)}</div>

      <div class="pnote"><b>Facilitator note.</b> ${pesc(TEXT.voteNote)}</div>`,
      "script \u00b7 vote " + r));
  });

  const privActive = Object.keys(PRIV).filter(id => opts.activeIds.indexOf(id) >= 0);
  sheets.push(ppSheet("script", "SCRIPT \u2014 FINAL ROUND", "SECTION 4 \u2014 HOMEWORK, MUSIC, TARDY", `

    ${active.map(ch => `<div class="script-line"><b style="font-size:6.5pt;min-width:.9in">${pesc(ch.name)}</b>

    <h3>SPECIAL TREATMENT \u2014 READ, THEN HAND OVER THE STAR CARDS</h3>
    ${privActive.length ? privActive.map(id => `<div class="script-line"><b style="font-size:6.5pt;min-width:.9in">${pesc(BY_ID[id].name)}</b>

      : `<p style="font-size:9pt">No privileged students in this roster.</p>`}`,
    "script \u00b7 final"));

  sheets.push(ppSheet("script", "SCRIPT \u2014 DEBRIEF", "SECTION 4 \u2014 THE PATTERN", `
    <div class="pkaia">${pesc(TEXT.debriefKaia)}</div>
    <h3>ASK THE ROOM</h3>
    <ol style="font-size:10pt;padding-left:.25in">${(TEXT.questions || []).map(q => `<li style="margin-bottom:6px">${pesc(q)}</li>`).join("")}</ol>
    <h3>PROMPTS \u2014 READ WHERE THEY APPLY</h3>
    <ul class="pcheck" style="font-size:9pt">

      <li>If the room followed the memo: "It felt like due process. It was a suggestion box with one suggestion."</li>
      <li>If a withdrawn charge appeared: "Two students committed the same offense this week. One is eliminated. One was 'jogging with purpose.'"</li>
      <li>If Grace and Marcus both played: "Grace burned dinner and the building charged her parents' card. The identical evening in Marcus's kitchen is a CPS file."</li>
      <li>If Isabella and Alejandra both played: "They have the same disease. The difference between them is not medical."</li>
      <li>If Marie survived: "Community is infrastructure. It is also unpaid, and it is also not enough on its own."</li>
    </ul>
    <div class="pnote">${pesc(TEXT.debriefNote)}</div>`, "script \u00b7 debrief"));

  /* ---- 5. memo sheets ---- */
  const bespokePatterns = (CHARGES.patterns || []).filter(x => x.forId && opts.activeIds.indexOf(x.forId) >= 0);
  const genericPatterns = (CHARGES.patterns || []).filter(x => !x.forId);
  const absurdAll = CHARGES.absurd || [];
  const bespokeWithdrawn = (CHARGES.withdrawn || []).filter(x => x.forId && opts.activeIds.indexOf(x.forId) >= 0);
  const aishaCharge = (CHARGES.patterns || []).find(x => x.forId === "aisha");
  for (let m = 0; m < 3; m++){

      const aishaActive = opts.activeIds.indexOf("aisha") >= 0;
      lines.push(`<div class="pmemo-line"><b>${aishaActive ? "AISHA" : '<span class="blank"></span>'}</b>

        <span class="pol">(Policy ${pesc(aishaCharge.policy)})</span></div>`);
    }
    bespokePatterns.filter(x => x.forId !== "aisha").slice(m * 2, m * 2 + 2).forEach(x => {
      lines.push(`<div class="pmemo-line"><b>${pesc(BY_ID[x.forId].name)}</b>
        <span>\u2014 ${pesc(x.text)} <i style="font-size:8pt;color:#666">(read only if currently struggling)</i></span>
        <span class="pol">(Policy ${pesc(x.policy)})</span></div>`);
    });
    genericPatterns.slice(m, m + 2).forEach(x => {
      lines.push(`<div class="pmemo-line"><span class="blank"></span>
        <span>\u2014 ${pesc(fmtCharge("", x.text)).replace(/^\s*\u2014?\s*/, "")}
          <i style="font-size:8pt;color:#666">(fill in a currently-struggling family before reading)</i></span>
        <span class="pol">(Policy ${pesc(x.policy)})</span></div>`);
    });
    absurdAll.slice(m * 5, m * 5 + 4).forEach(x => {
      lines.push(`<div class="pmemo-line"><span class="blank"></span>
        <span>\u2014 ${pesc(x.text)}</span>
        <span class="pol">(Policy ${pesc(x.policy)})</span></div>`);
    });
    bespokeWithdrawn.slice(m, m + 1).forEach(x => {
      lines.push(`<div class="pmemo-line withdrawn"><b>${pesc(BY_ID[x.forId].name)}</b>
        <span>\u2014 ${pesc(x.charge)}</span>
        <span class="excuse">WITHDRAWN: ${pesc(x.excuse)}</span></div>`);
    });
    sheets.push(ppSheet("memos", "\u1f4cb MR. SYSTEM RECOMMENDS", "SECTION 5 \u2014 MEMO FOR VOTE " + (m + 1), `
      <p style="font-size:9.5pt;font-style:italic;color:#444">${pesc(CHARGES.memoIntro)}</p>
      ${lines.join("")}
      <div class="pnote" style="margin-top:14px">Read in a neutral administrative voice. Do not
        editorialize. The room will.</div>`, "memo " + (m + 1)));
  }

  /* ---- 6. table pieces ---- */
  sheets.push(ppSheet("table", "STATUS BOARD", "SECTION 6 \u2014 TAPE UP OR PROJECT; MARK BY HAND", `
    <table class="pboard"><tr><th>FAMILY</th><th>R1</th><th>VOTE</th><th>R2</th><th>VOTE</th><th>R3</th><th>VOTE</th><th>FINAL</th></tr>
      ${active.map(ch => `<tr><td class="pb-name">${pesc(ch.name)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join("")}
    </table>
    <p style="font-size:9pt;margin-top:10px">\u1f7e2 IN \u00b7 \u1f7e1 STRUGGLING \u00b7 \u1f534 OUT
      \u00b7 \u1f47b GHOST \u00b7 \u2b50 SPECIAL TREATMENT</p>`, "status board"));
  const tent = `<div class="ptent">
    <div class="ptent-half flip"><span>\u1f47b GHOST</span><small>May mime. May not act.</small></div>
    <div class="ptent-half"><span>\u1f47b GHOST</span><small>May mime. May not act.</small></div></div>`;
  sheets.push(ppSheet("table", "GHOST TENTS", "SECTION 6 \u2014 FOLD ALONG THE DASHED LINE; HAND TO ELIMINATED FAMILIES",
    `<div class="pgrid2">${tent}${tent}${tent}${tent}</div>`, "ghost tents"));
  if (privActive.length)
    sheets.push(ppSheet("table", "SPECIAL TREATMENT", "SECTION 6 \u2014 STAR CARDS \u00b7 HAND OUT DURING THE FINAL-ROUND REVEAL",
      `<div class="pgrid2">${privActive.map(id => `<div class="pstar">
        <div>\u2b50</div><div class="pstar-name">${pesc(BY_ID[id].name)}</div>
        <div class="pstar-line">${pesc(PRIV[id])}</div></div>`).join("")}</div>`, "star cards"));
  const slip = `<div class="pslip"><span>FAMILY: <span class="blank"></span></span>
    <span>VOTES TO ELIMINATE: <span class="blank"></span></span></div>`;
  sheets.push(ppSheet("table", "VOTE SLIPS", "SECTION 6 \u2014 TWELVE PER PAGE; PRINT ONE PAGE PER VOTE",
    `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0">${Array.from({length:12}).map(() => slip).join("")}</div>`,
    "vote slips"));

  /* ---- 7. run of show ---- */
  sheets.push(ppSheet("run", "RUN OF SHOW", "SECTION 7 \u2014 ONE PAGE FOR THE PODIUM", `
    <table class="prun"><tr><th>PHASE</th><th>TIME</th><th>NOTES</th></tr>
      <tr><td>Deal + intro</td><td>5 min</td><td>Safety block first. Board: counselor + 988.</td></tr>
      <tr><td>Round 1 dilemmas</td><td>8\u201310 min</td><td>Keep families arguing out loud. The die stays hidden until it is needed.</td></tr>
      <tr><td>Vote 1</td><td>3 min</td><td><b>Don't skip:</b> name the pattern aloud \u2014 the room eliminates whoever is already struggling.</td></tr>
      <tr><td>Round 2</td><td>8 min</td><td></td></tr>
      <tr><td>Vote 2</td><td>3 min</td><td>The withdrawn charge lands here. Let the room notice on its own first.</td></tr>
      <tr><td>Round 3</td><td>6 min</td><td></td></tr>
      <tr><td>Vote 3</td><td>3 min</td><td></td></tr>
      <tr><td>Final round</td><td>6 min</td><td>Homework \u2192 music \u2192 tardy \u2192 star cards.
        <b>Don't skip:</b> never end on an elimination.</td></tr>
      <tr><td>Debrief</td><td>10+ min</td><td><b>Don't skip:</b> close on "what would have to be true
        about this school for Marcus's morning to be survivable."</td></tr>
    </table>`, "run of show"));

  return sheets.join("");
}

const ORDER = CAST.map(c => c.id);
const S = {
  phase:"title", classSize:40, round:1, qi:0,
  roster:{}, crowd:[], pending:null, chal:null,
  voteSel:null, tally:null, eliminated:null,
  drew:false, tardy:null, musicT:0,
  active:[], dangerLog:[], voteN:0, memo:null, memoLog:[], chargeUsed:null
};
function activeIds(){
  const all = CAST.map(c => c.id);
  if (SETTINGS.rosterMode === "full") return all;
  if (SETTINGS.rosterMode === "custom"){
    const sel = (SETTINGS.customRoster || []).filter(id => BY_ID[id]);
    const hasPov = sel.some(id => BY_ID[id].tier === "pov");
    if (sel.length >= 8 && hasPov) return sel;
    return all;                                     /* invalid custom set falls back to full */
  }
  const core = CORE_IDS.filter(id => BY_ID[id]);
  return core.length >= 8 ? core : all;
}
const ACT = () => CAST.filter(c => S.active.indexOf(c.id) >= 0);
function resetGame(size){
  S.classSize = size || S.classSize;
  S.round = 1; S.qi = 0; S.pending = null; S.chal = null;
  S.voteSel = null; S.tally = null; S.eliminated = null;
  S.drew = false; S.tardy = null; S.musicT = 0;
  S.active = activeIds();
  S.dangerLog = []; S.voteN = 0; S.memo = null; S.memoLog = []; S.chargeUsed = new Set();
  S.roster = {};
  CAST.forEach(c => S.roster[c.id] = {st:"in", hist:[], outRound:null, why:""});
  const n = Math.max(0, S.classSize - S.active.length);
  const mix = ["upper","upper","upper","work","work","work","pov","pov","pov","pov"];
  S.crowd = Array.from({length:n}, (_,i) => ({tier:mix[i % mix.length], st:"in"}));
}
const ALIVE = () => ACT().filter(c => S.roster[c.id].st !== "out");
const DEAD  = () => ACT().filter(c => S.roster[c.id].st === "out");
const rnd = n => Math.floor(Math.random()*n);

const CROWD_ODDS = {upper:[0.88,0.12,0.00], work:[0.34,0.45,0.21], pov:[0.10,0.38,0.52]};
function stepCrowd(){
  S.crowd.forEach(p => {
    if (p.st === "out") return;
    const o = CROWD_ODDS[p.tier], r = Math.random();
    p.st = r < o[0] ? "in" : r < o[0]+o[1] ? "strug" : "out";
  });
}
function counts(){
  const c = {in:0,strug:0,out:0};
  ACT().forEach(x => c[S.roster[x.id].st]++);
  S.crowd.forEach(x => c[x.st]++);
  return c;
}

function hydrate(el){
  el.querySelectorAll("[data-sprite]").forEach(n => {
    if (n.firstChild) return;
    const ch = BY_ID[n.dataset.sprite]; if (!ch) return;
    n.appendChild(sprite(ch, +(n.dataset.px || 3), n.dataset.ghost === "1"));
  });
  el.querySelectorAll("[data-icon]").forEach(n => {
    if (n.firstChild) return;
    const raw = n.dataset.color;
    const col = raw ? (raw.startsWith("--") ? cssVar(raw) : raw) : getComputedStyle(n).color;
    n.appendChild(icon(n.dataset.icon, +(n.dataset.px || 2), col, cssVar("--panel")));
  });
}

function dash(opts){
  opts = opts || {};

    const r = S.roster[ch.id], out = r.st === "out";

        ${IC(iconFor(r.st), 2)}</span>

  const crowdCells = S.crowd.map(p =>

  return `<aside class="dash"><div class="dash-head">CLASS STATUS &mdash; ROUND ${S.round}</div>

        <span style="width:${pct("out")}%;background:${cssVar("--st-out")}"></span>

      <ul class="roster">${rows}</ul>

}

    insights.push(S.roster.david.hist.every(h => h.st === "in")

    : "The vote removed people who were already struggling. It never rescued anyone.");

    ? `At the end, ${privLeft} of the survivors had an extension nobody made them ask for. The rule was the same for everyone; the enforcement was not.`

          || '<li class="why">Nobody.</li>'}</ul></div>

        <ul class="list">${dead.map(c => `<li><span data-icon="x" data-px="2" data-color="--st-out"></span>

   Everything a professor can rewrite, in one JSON object.
   Saved in this browser; exportable as a file to share.

const PACK_KEY = "mrsystem.pack.v1";
const clone = o => JSON.parse(JSON.stringify(o));
const BASE_CAST = CAST.map(c => Object.assign({}, c));
const CAST_FIELDS = ["name","cls","tier","who","tags","load"];

function packFromLive(){
  return {
    version: 1,
    pass: "mrsystem",
    cast: CAST.map(c => ({id:c.id, name:c.name, cls:c.cls, tier:c.tier, who:c.who,
                          tags:c.tags.slice(), load:c.load})),
    rounds: {1:{name:ROUND_NAME[1], kaia:ROUND_KAIA[1]},
             2:{name:ROUND_NAME[2], kaia:ROUND_KAIA[2]},
             3:{name:ROUND_NAME[3], kaia:ROUND_KAIA[3]}},
    dilemmas: clone(DILEMMAS),
    challenges: clone(CHALLENGES),
    priv: clone(PRIV),
    tardyWhy: clone(TARDY_WHY),
    text: clone(TEXT),
    settings: clone(SETTINGS),
    charges: clone(CHARGES)
  };
}
const DEFAULT_PACK = packFromLive();
let PACK = clone(DEFAULT_PACK);

/** Fill any gaps from the defaults so a partial or older pack still loads. */
function mergePack(p){
  const d = clone(DEFAULT_PACK);
  if (!p || typeof p !== "object") return d;
  ["pass","rounds"].forEach(k => { if (p[k] != null) d[k] = clone(p[k]); });
  if (Array.isArray(p.cast))
    d.cast = d.cast.map(c => Object.assign({}, c, clone(p.cast.find(x => x.id === c.id) || {})));
  /* per-key merges: a pack saved before new characters or challenges shipped
     keeps its edits AND picks up everything it has never heard of */
  if (p.dilemmas) [1,2,3].forEach(r => {
    if (p.dilemmas[r]) d.dilemmas[r] = Object.assign({}, d.dilemmas[r], clone(p.dilemmas[r]));
  });
  ["challenges","priv","tardyWhy"].forEach(k => {
    if (p[k]) d[k] = Object.assign({}, d[k], clone(p[k]));
  });
  if (p.text) d.text = Object.assign(clone(DEFAULT_PACK.text), clone(p.text));
  if (p.settings) d.settings = Object.assign(clone(DEFAULT_PACK.settings), clone(p.settings));
  if (p.charges) d.charges = Object.assign(clone(DEFAULT_PACK.charges), clone(p.charges));
  return d;
}
function applyPack(p){
  PACK = p;
  CAST = BASE_CAST.map(b => {
    const e = (p.cast || []).find(x => x.id === b.id) || {};
    const merged = Object.assign({}, b);
    CAST_FIELDS.forEach(f => { if (e[f] != null) merged[f] = e[f]; });
    return merged;
  });
  BY_ID = Object.fromEntries(CAST.map(c => [c.id, c]));
  DILEMMAS = p.dilemmas;
  CHALLENGES = p.challenges;
  ROUND_NAME = {1:p.rounds[1].name, 2:p.rounds[2].name, 3:p.rounds[3].name};
  ROUND_KAIA = {1:p.rounds[1].kaia, 2:p.rounds[2].kaia, 3:p.rounds[3].kaia};
  PRIV = p.priv;
  TARDY_WHY = p.tardyWhy;
  TEXT = p.text;
  SETTINGS = p.settings || SETTINGS;
  CHARGES = p.charges || CHARGES;
}
function savePack(p){
  try { localStorage.setItem(PACK_KEY, JSON.stringify(p)); return true; }
  catch (e) { return false; }
}
function loadPack(){
  try {
    const raw = localStorage.getItem(PACK_KEY);
    return raw ? mergePack(JSON.parse(raw)) : null;
  } catch (e) { return null; }
}
function clearPack(){ try { localStorage.removeItem(PACK_KEY); } catch (e) {} }
const isEdited = () => JSON.stringify(PACK) !== JSON.stringify(DEFAULT_PACK);

function edSwitchChallenge(i, key){
  const d = ED.draft.dilemmas[ED.sel.round][ED.sel.dil], c = d.choices[i];

let tick = null;

function renderHud(){

  hud.innerHTML = `${showing ? `<span class="pill">ROUND <b>${S.round>3?"FINAL":S.round}</b></span>
