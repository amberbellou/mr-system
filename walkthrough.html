 aisha:{sit:"Mom left for inventory at 5:40. Getting dressed means finding what fits, what covers, and what the hallway won't have something to say about. The bus is at 7:52.", choices:[

 marcus:{sit:"You and three younger siblings. $2.50 for fares that cost $3 each. The youngest won't put his shoes on.", choices:[

 alejandra:{sit:"It is a bad pain day, and it arrived on schedule. The doctors called it endometriosis inside a year and opened a file. There is a diagnosis, a plan, and a specialist whose cell number your mother keeps.", choices:[

 priya:{sit:"Tutor at six, your own homework after, and a school voicemail nobody but you can understand.", choices:[

 carlos:{sit:"The shop needs closing at seven. Your homework is untouched. Your dad is asleep before you get home.", choices:[

 chase:{sit:"70 minutes home. There is no internet past the county line, and the assignment is online.", choices:[

 isabella:{sit:"It is a bad pain day and it is only getting worse. The doctors called it weight-related and closed the file. There is no diagnosis, and no healthcare you can reach.", choices:[

 marcus:{sit:"Pick the youngest up from the elementary school across town. Walk all four of you home by five. Cook. Homework. Bedtime.", choices:[

 lucia:{sit:"You have been in the apartment all day. Your mom still is not back. The 10-year-old keeps asking when she is coming home and the 6-year-old has stopped asking, which is worse.", choices:[

 jayson:{sit:"The dysphoria is crushing today and you are running on nothing. Two younger siblings still need picking up at 3:15.", choices:[

 sophia:{sit:"Nine days becomes ten. Your brother is asking questions. Rent was due on the first.", choices:[

3:{
 ayesha:{sit:"Past ten. Your mom is at the dining table with one folder and the phone. Through your door you hear her half of it: an attendance hearing, the word \u201cplacement,\u201d and once, \u201cthe one with the three little ones and the bus fares.\u201d", choices:[

 tyler:{sit:"It starts at 9:40 the way it starts: a cabinet door, then his voice, then your mother's, lower. Your sister is eight and her room shares a wall with the kitchen. Yours doesn't.", choices:[

 alejandra:{sit:"Your mother has laid out a college list on the kitchen table. It's 10:40 PM.", choices:[

 priya:{sit:"Your father wants to talk about your chemistry grade. It is an A minus.", choices:[

 isabella:{sit:"You wake at 2 AM and cannot get back to sleep, or upright. The final assignment is due tomorrow.", choices:[

 lucia:{sit:"Third night. What is left in the kitchen is a bag of rice and half a jar of peanut butter.", choices:[

    <div class="kbox" style="max-width:76ch">"The room eliminated the struggling families. Mr. System had

/* ================= RENDER + NAV ================= */
let cur = 0;
function renderDeck(){
  stage.innerHTML = SLIDES.map((s, i) => `<section class="slide${i === cur ? " on" : ""}" role="group"
    aria-roledescription="slide" aria-label="Slide ${i + 1} of ${SLIDES.length}: ${esc(s.name)}"
    ${i === cur ? "" : 'aria-hidden="true"'}>${s.build()}</section>`).join("");
  stage.querySelectorAll("[data-sp]").forEach(n => {
    n.appendChild(spriteEl(n.dataset.sp, +(n.dataset.px || 3), n.dataset.ghost === "1"));
  });
  drawCorgi();
  paintNav();
}
function paintNav(){
  document.getElementById("counter").textContent = (cur + 1) + " / " + SLIDES.length;
  document.getElementById("progress").style.width = ((cur + 1) / SLIDES.length * 100) + "%";
  document.getElementById("prev").disabled = cur === 0;
  document.getElementById("next").disabled = cur === SLIDES.length - 1;
  document.querySelectorAll(".slide").forEach((el, i) => {
    el.classList.toggle("on", i === cur);
    if (i === cur) el.removeAttribute("aria-hidden"); else el.setAttribute("aria-hidden", "true");
  });
  document.getElementById("live").textContent = "Slide " + (cur + 1) + " of " + SLIDES.length + ": " + SLIDES[cur].name;
}
function goTo(i){ cur = Math.max(0, Math.min(SLIDES.length - 1, i)); paintNav(); }
document.getElementById("prev").addEventListener("click", () => goTo(cur - 1));
document.getElementById("next").addEventListener("click", () => goTo(cur + 1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); goTo(cur + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(cur - 1); }
  if (e.key === "Home") goTo(0);
  if (e.key === "End") goTo(SLIDES.length - 1);
  if (e.key === "Escape") document.getElementById("idx").classList.remove("on");
});
let tx = null;
stage.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive: true});
stage.addEventListener("touchend", e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 48) goTo(cur + (dx < 0 ? 1 : -1));
  tx = null;
}, {passive: true});
document.getElementById("indexBtn").addEventListener("click", () => {
  const idx = document.getElementById("idx");
  document.getElementById("idxGrid").innerHTML = SLIDES.map((s, i) =>
    `<button class="idx-b" data-i="${i}"><em>${String(i + 1).padStart(2, "0")}</em>${esc(s.name)}</button>`).join("");
  idx.classList.add("on");
});
document.getElementById("idx").addEventListener("click", e => {
  const b = e.target.closest(".idx-b");
  if (b){ goTo(+b.dataset.i); document.getElementById("idx").classList.remove("on"); return; }
  if (e.target.id === "idx" || e.target.closest("[data-close]")) document.getElementById("idx").classList.remove("on");
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = dark ? "MORNING" : "DUSK";
});

/* the closer's corgi, on its brick */
function drawCorgi(){
  const cv = document.getElementById("corgi"); if (!cv) return;
  const g = cv.getContext("2d"), P = 6;
  const rows = [
    ".OO.....OO....",
    ".OOO...OOO....",
    ".OOOOOOOOO....",
    ".OWKWOWKWO....",
    ".OWWWWWWWO....",
    "..OWWkWWO.....",
    ".OOOOOOOOOOO..",
    ".OWWOOOOOOWO.O",
    ".OOOOOOOOOOOO.",
    "..O..O..O..O..",
  ];
  const pal = {O:"#C97B36", W:"#F2E3C8", K:"#141C26", k:"#141C26"};
  g.clearRect(0, 0, cv.width, cv.height);
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++){
    const c = row[x]; if (c === ".") continue;
    g.fillStyle = pal[c] || pal.O; g.fillRect(x * P, y * P, P, P);
  }});
  g.fillStyle = "#A0522D";
  g.fillRect(0, 60, 84, 6);
  g.fillStyle = "#8a4423";
  for (let x = 0; x < 84; x += 14) g.fillRect(x, 60, 2, 6);
}

renderDeck();
